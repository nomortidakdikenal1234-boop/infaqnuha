    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDd-w0bzJ_Qijy-aMCv7NszYXO0isQHuXI",
            authDomain: "linuhawebsite.firebaseapp.com",
            projectId: "linuhawebsite",
            storageBucket: "linuhawebsite.firebasestorage.app",
            messagingSenderId: "976390167378",
            appId: "1:976390167378:web:8d7af05b7b34ef0eef388b",
            measurementId: "G-1N5Z4SE0D7"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'linuha-default-app';
        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function initAdminCloudSync() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'database', 'main_db');
                
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        window.DB = Object.assign({}, window.initialDB, snapshot.data());
                    } else {
                        window.DB = window.initialDB;
                        setDoc(docRef, window.initialDB).catch(console.error);
                    }
                    localStorage.setItem('NUHA_DATABASE', JSON.stringify(window.DB));
                    if (typeof window.renderAdminApp === 'function') {
                        window.renderAdminApp();
                    }
                }, (error) => {
                    console.warn("Firebase Admin Snapshot fallback to LocalStorage:", error);
                });
            } catch (err) {
                console.error("Auth Firebase Admin Error:", err);
            }
        }

        window.saveDBCloud = async function() {
            if (!auth.currentUser) return;
            try {
                localStorage.setItem('NUHA_DATABASE', JSON.stringify(window.DB));
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'database', 'main_db');
                await setDoc(docRef, window.DB, { merge: true });
            } catch (err) {
                console.error("Save DB Error:", err);
            }
        };

        initAdminCloudSync();
    </script>

                                            <option value="manual">Manual (Nominal Custom)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-600 block">Nominal Terkumpul Manual (Rp)</label>
                                        <input type="number" id="prog-terkumpul-manual" placeholder="Jika mode manual..." class="w-full p-3 border rounded-xl text-xs">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Program</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="prog-foto" placeholder="Paste Link Foto URL..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="prog-file" onchange="uploadImageFile(this, 'prog-foto')" class="hidden">
                                        <button onclick="document.getElementById('prog-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl hover:bg-gray-300">Upload</button>
                                    </div>
                                </div>

                                <button onclick="addProgram()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark">Simpan Program Baru</button>
                            </div>

                            <div class="space-y-4 pt-4">
                                <h4 class="font-bold text-xs text-gray-800">Daftar Program & Kontrol Perhitungan Dana</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${(DB.programs||[]).map((prog, idx) => `
                                        <div class="p-4 border border-gray-200 rounded-2xl bg-white space-y-3 shadow-xs">
                                            <img src="${prog.foto}" class="w-full h-32 object-cover rounded-xl border">
                                            <div class="space-y-2">
                                                <input type="text" id="prog-edit-judul-${idx}" value="${prog.judul}" class="w-full p-2 border rounded-lg text-xs font-bold">
                                                
                                                <div class="grid grid-cols-2 gap-2">
                                                    <div>
                                                        <label class="text-[10px] text-gray-500 font-bold block">Target (Rp)</label>
                                                        <input type="number" id="prog-edit-target-${idx}" value="${prog.target}" class="w-full p-2 border rounded-lg text-xs font-bold">
                                                    </div>
                                                    <div>
                                                        <label class="text-[10px] text-gray-500 font-bold block">Mode Perhitungan</label>
                                                        <select id="prog-edit-mode-${idx}" class="w-full p-2 border rounded-lg text-xs font-bold bg-gray-50">
                                                            <option value="auto" ${prog.calcMode==='auto'||!prog.calcMode?'selected':''}>Otomatis</option>
                                                            <option value="manual" ${prog.calcMode==='manual'?'selected':''}>Manual</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label class="text-[10px] text-gray-500 font-bold block">Dana Terkumpul Manual (Rp)</label>
                                                    <input type="number" id="prog-edit-manual-${idx}" value="${prog.terkumpulManual || prog.terkumpul || 0}" class="w-full p-2 border rounded-lg text-xs text-emerald-700 font-bold">
                                                </div>

                                                <div class="flex gap-2 pt-1">
                                                    <button onclick="updateProgram(${idx})" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold">Update Program</button>
                                                    <button onclick="removeProgram(${idx})" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold">Hapus</button>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;

                case 'pengurus':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Susunan Pengurus</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input type="text" id="pengurus-nama" placeholder="Nama Lengkap..." class="p-3 border rounded-xl text-xs">
                                    <input type="text" id="pengurus-jabatan" placeholder="Jabatan..." class="p-3 border rounded-xl text-xs">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Pengurus</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="pengurus-foto" placeholder="Paste URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="p-file" onchange="uploadImageFile(this, 'pengurus-foto')" class="hidden">
                                        <button onclick="document.getElementById('p-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload</button>
                                    </div>
                                </div>
                                <button onclick="addPengurus()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold">Simpan Pengurus</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t">
                                ${(DB.pengurusList||[]).map((p, idx) => `
                                    <div class="p-3 border rounded-2xl bg-white text-center space-y-2">
                                        <h4 class="font-bold text-xs text-gray-900">${p.nama}</h4>
                                        <span class="text-[10px] text-nuha-primary font-bold block">${p.jabatan}</span>
                                        <button onclick="removePengurus(${idx})" class="w-full py-1 bg-red-100 text-red-600 rounded text-xs font-bold">Hapus</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'gallery':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Galeri Foto LINUHA</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="gal-judul" placeholder="Judul / Keterangan Foto..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="date" id="gal-tanggal" class="w-full p-3 border rounded-xl text-xs">
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Galeri</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="gal-foto" placeholder="Paste URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="g-file" onchange="uploadImageFile(this, 'gal-foto')" class="hidden">
                                        <button onclick="document.getElementById('g-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload</button>
                                    </div>
                                </div>
                                <button onclick="addGalleryItem()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark">Simpan ke Galeri</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t">
                                ${(DB.gallery||[]).map((item, idx) => `
                                    <div class="p-3 border rounded-2xl bg-white space-y-2">
                                        <img src="${item.foto}" class="h-32 w-full object-cover rounded-xl">
                                        <h4 class="font-bold text-xs text-gray-900">${item.judul}</h4>
                                        <span class="text-[10px] text-gray-400 block">${item.tanggal || ''}</span>
                                        <button onclick="removeGalleryItem(${idx})" class="w-full py-1.5 bg-red-100 text-red-600 rounded-lg text-xs font-bold">Hapus</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'heroSlides':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Hero Slide Slider</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="slide-judul" placeholder="Judul Teks Slide..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="text" id="slide-subjudul" placeholder="Subjudul Teks Slide..." class="w-full p-3 border rounded-xl text-xs">
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Hero Slide</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="slide-foto" placeholder="Paste URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="s-file" onchange="uploadImageFile(this, 'slide-foto')" class="hidden">
                                        <button onclick="document.getElementById('s-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload</button>
                                    </div>
                                </div>
                                <button onclick="addHeroSlide()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark">Tambah Slide</button>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t">
                                ${(DB.heroSlides||[]).map((slide, idx) => `
                                    <div class="p-4 border rounded-2xl bg-white space-y-2">
                                        <img src="${slide.foto}" class="h-32 w-full object-cover rounded-xl">
                                        <h4 class="font-bold text-xs text-gray-900">${slide.judul}</h4>
                                        <p class="text-[10px] text-gray-500">${slide.subjudul || ''}</p>
                                        <button onclick="removeHeroSlide(${idx})" class="w-full py-1.5 bg-red-100 text-red-600 rounded-lg text-xs font-bold">Hapus Slide</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'verifikasi':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Konfirmasi Donasi Masuk</h3>
                            <div class="space-y-4">
                                ${(DB.pendingConfirmations||[]).length === 0 ? '<p class="text-xs text-gray-500">Belum ada donasi masuk.</p>' : ''}
                                ${(DB.pendingConfirmations||[]).map((c, idx) => `
                                    <div class="p-4 border rounded-2xl bg-white flex justify-between items-center">
                                        <div>
                                            <span class="font-bold text-xs text-nuha-primary">${c.trxCode}</span>
                                            <h4 class="font-bold text-sm text-gray-900">${c.donorName}</h4>
                                            <p class="text-xs font-bold text-emerald-700">${formatRupiah(c.amount)}</p>
                                        </div>
                                        <div class="flex gap-2">
                                            <button onclick="approveDonation(${idx})" class="px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">Setujui</button>
                                            <button onclick="rejectDonation(${idx})" class="px-3 py-1.5 bg-red-600 text-white font-bold text-xs rounded-xl">Tolak</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'logs':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Log Aktivitas IP</h3>
                            <div class="flex gap-2">
                                <input type="text" id="ip-to-block" placeholder="Masukkan Alamat IP..." class="flex-1 p-3 border rounded-xl text-xs">
                                <button onclick="blockIP()" class="px-4 py-3 bg-red-600 text-white font-bold text-xs rounded-xl">Blokir IP</button>
                            </div>
                        </div>
                    `;

                case 'berita':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Berita & Embed Media</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="news-judul" placeholder="Judul Berita..." class="w-full p-3 border rounded-xl text-xs">
                                <textarea id="news-ringkasan" rows="2" placeholder="Ringkasan Berita..." class="w-full p-3 border rounded-xl text-xs"></textarea>
                                <input type="text" id="news-embed" placeholder="Link Media (YouTube / TikTok / IG)..." class="w-full p-3 border rounded-xl text-xs">
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Sampul Berita</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="news-foto" placeholder="Paste URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="n-file" onchange="uploadImageFile(this, 'news-foto')" class="hidden">
                                        <button onclick="document.getElementById('n-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload</button>
                                    </div>
                                </div>
                                <button onclick="addNewsItem()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark">Terbitkan Berita</button>
                            </div>
                            <div class="space-y-3 pt-4 border-t">
                                ${(DB.news||[]).map((n, idx) => `
                                    <div class="p-4 border rounded-2xl bg-white flex justify-between items-center gap-4">
                                        <div>
                                            <h4 class="font-bold text-xs text-gray-900">${n.judul}</h4>
                                            <p class="text-[10px] text-gray-500">${n.tanggal || ''}</p>
                                        </div>
                                        <button onclick="removeNewsItem(${idx})" class="px-3 py-1.5 bg-red-100 text-red-600 rounded-lg text-xs font-bold">Hapus</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'pembayaran':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Bank & QRIS</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="pay-name" placeholder="Nama Bank / QRIS..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="text" id="pay-account" placeholder="Nomor Rekening / Keterangan..." class="w-full p-3 border rounded-xl text-xs">
                                <button onclick="addPaymentMethod()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold">Simpan Pembayaran</button>
                            </div>
                            <div class="space-y-2 pt-4 border-t">
                                ${(DB.paymentMethods||[]).map((m, idx) => `
                                    <div class="p-3 border rounded-xl bg-white flex justify-between items-center">
                                        <div>
                                            <h4 class="font-bold text-xs text-gray-900">${m.name}</h4>
                                            <p class="text-[10px] text-nuha-primary font-mono">${m.account}</p>
                                        </div>
                                        <button onclick="removePaymentMethod(${idx})" class="px-3 py-1 bg-red-100 text-red-600 text-xs font-bold rounded">Hapus</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                default:
                    return `<div class="p-4 bg-white rounded-2xl text-xs">Tab tidak ditemukan.</div>`;
            }
        }

        function setAdminTab(tab) {
            adminState.adminSubTab = tab;
            renderAdminApp();
        }

        function logoutAdmin() {
            sessionStorage.removeItem('NUHA_ADMIN_AUTH');
            adminState.isLoggedIn = false;
            renderAdminApp();
        }

        function uploadImageFile(fileInput, targetId) {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const target = document.getElementById(targetId);
                    if (target) target.value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function updateSettings() {
            DB.settings.siteName = document.getElementById('set-site-name')?.value || DB.settings.siteName;
            DB.settings.phone = document.getElementById('set-phone')?.value || DB.settings.phone;
            DB.settings.siteLogo = document.getElementById('set-logo-url')?.value || DB.settings.siteLogo;
            DB.settings.loginBanner = document.getElementById('set-login-banner')?.value || DB.settings.loginBanner;
            DB.settings.aboutText = document.getElementById('set-about-text')?.value || DB.settings.aboutText;
            DB.settings.visiText = document.getElementById('set-visi-text')?.value || DB.settings.visiText;
            DB.settings.misiText = document.getElementById('set-misi-text')?.value || DB.settings.misiText;
            saveDB();
            alert('Pengaturan Berhasil Disimpan!');
            renderAdminApp();
        }

        function toggleWebsiteLock(lock) {
            DB.settings.isLocked = lock;
            saveDB();
            alert(lock ? 'Website Dikunci (Mode Pemeliharaan)!' : 'Akses Website Dibuka kembali!');
            renderAdminApp();
        }

        function addProgram() {
            const j = document.getElementById('prog-judul')?.value;
            const k = document.getElementById('prog-kategori')?.value || 'Program';
            const d = document.getElementById('prog-deskripsi')?.value;
            const t = parseFloat(document.getElementById('prog-target')?.value || 0);
            const m = document.getElementById('prog-calc-mode')?.value || 'auto';
            const val = parseFloat(document.getElementById('prog-terkumpul-manual')?.value || 0);
            const f = document.getElementById('prog-foto')?.value;

            if (j) {
                if(!DB.programs) DB.programs = [];
                DB.programs.push({
                    id: Date.now(), judul: j, kategori: k, deskripsi: d, target: t, calcMode: m, terkumpulManual: val, terkumpul: val, foto: f
                });
                saveDB();
                alert('Program Berhasil Ditambahkan!');
                renderAdminApp();
            }
        }

        function updateProgram(idx) {
            if (DB.programs && DB.programs[idx]) {
                DB.programs[idx].judul = document.getElementById(`prog-edit-judul-${idx}`)?.value || DB.programs[idx].judul;
                DB.programs[idx].target = parseFloat(document.getElementById(`prog-edit-target-${idx}`)?.value || 0);
                DB.programs[idx].calcMode = document.getElementById(`prog-edit-mode-${idx}`)?.value;
                const manualVal = parseFloat(document.getElementById(`prog-edit-manual-${idx}`)?.value || 0);
                DB.programs[idx].terkumpulManual = manualVal;
                DB.programs[idx].terkumpul = manualVal;
                saveDB();
                alert('Program Diperbarui!');
                renderAdminApp();
            }
        }

        function removeProgram(idx) {
            DB.programs.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addHeroSlide() {
            const j = document.getElementById('slide-judul')?.value;
            const sub = document.getElementById('slide-subjudul')?.value;
            const f = document.getElementById('slide-foto')?.value;

            if (j && f) {
                if(!DB.heroSlides) DB.heroSlides = [];
                DB.heroSlides.push({ id: Date.now(), judul: j, subjudul: sub, foto: f });
                saveDB();
                alert('Hero Slide Ditambahkan!');
                renderAdminApp();
            }
        }

        function removeHeroSlide(idx) {
            DB.heroSlides.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addGalleryItem() {
            const j = document.getElementById('gal-judul')?.value;
            const t = document.getElementById('gal-tanggal')?.value || new Date().toISOString().split('T')[0];
            const f = document.getElementById('gal-foto')?.value;

            if (j && f) {
                if(!DB.gallery) DB.gallery = [];
                DB.gallery.unshift({ id: Date.now(), judul: j, tanggal: t, foto: f });
                saveDB();
                alert('Foto Galeri Ditambahkan!');
                renderAdminApp();
            }
        }

        function removeGalleryItem(idx) {
            DB.gallery.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addNewsItem() {
            const j = document.getElementById('news-judul')?.value;
            const r = document.getElementById('news-ringkasan')?.value;
            const e = document.getElementById('news-embed')?.value;
            const f = document.getElementById('news-foto')?.value;

            if (j) {
                if(!DB.news) DB.news = [];
                DB.news.unshift({
                    id: Date.now(), judul: j, ringkasan: r, embedUrl: e, foto: f, tanggal: new Date().toISOString().split('T')[0]
                });
                saveDB();
                alert('Berita Diterbitkan!');
                renderAdminApp();
            }
        }

        function removeNewsItem(idx) {
            DB.news.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addPengurus() {
            const n = document.getElementById('pengurus-nama')?.value;
            const j = document.getElementById('pengurus-jabatan')?.value;
            const f = document.getElementById('pengurus-foto')?.value;

            if (n && j) {
                if(!DB.pengurusList) DB.pengurusList = [];
                DB.pengurusList.push({ id: Date.now(), nama: n, jabatan: j, foto: f });
                saveDB();
                alert('Pengurus Ditambahkan!');
                renderAdminApp();
            }
        }

        function removePengurus(idx) {
            DB.pengurusList.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function approveDonation(idx) {
            if (DB.pendingConfirmations && DB.pendingConfirmations[idx]) {
                DB.pendingConfirmations[idx].status = 'Berhasil Terverifikasi';
                saveDB();
                alert('Donasi disetujui!');
                renderAdminApp();
            }
        }

        function rejectDonation(idx) {
            if (DB.pendingConfirmations && DB.pendingConfirmations[idx]) {
                DB.pendingConfirmations[idx].status = 'Ditolak';
                saveDB();
                renderAdminApp();
            }
        }

        function blockIP() {
            const ip = document.getElementById('ip-to-block')?.value.trim();
            if (ip) {
                if (!DB.blockedIPs) DB.blockedIPs = [];
                if (!DB.blockedIPs.includes(ip)) DB.blockedIPs.push(ip);
                saveDB();
                alert(`IP ${ip} Diblokir!`);
                renderAdminApp();
            }
        }

        function addPaymentMethod() {
            const n = document.getElementById('pay-name')?.value;
            const a = document.getElementById('pay-account')?.value;

            if (n && a) {
                if(!DB.paymentMethods) DB.paymentMethods = [];
                DB.paymentMethods.push({ id: Date.now(), name: n, account: a, active: true });
                saveDB();
                alert('Metode Pembayaran Ditambahkan!');
                renderAdminApp();
            }
        }

        function removePaymentMethod(idx) {
            DB.paymentMethods.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        window.onload = function() {
            renderAdminApp();
        };
    </script>
</body>
</html>
