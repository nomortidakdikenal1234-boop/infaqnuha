        description: '',
        fullContent: '',

        beneficiaries: '',

      });

      });

      const [galleryForm, setGalleryForm] = useState({
        title: '',

        description: '',
        imageUrl: ''
      });

      const supabaseRef = useRef(null);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const getSupabase = () => {
        if (!supabaseRef.current && window.supabase && DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_KEY) {
          try {
            supabaseRef.current = window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY);
          } catch (e) {
            console.error("Gagal createClient:", e);
          }
        }
        return supabaseRef.current;
      };

      const syncFromSupabase = async (isManual = false) => {
        setIsSyncing(true);
        const client = getSupabase();

        if (!client) {
          setIsSyncing(false);
          return;
        }

        try {
          const [progRes, donRes, galRes, catRes, sliRes] = await Promise.all([
            client.from('programs').select('*').order('created_at', { ascending: false }),
            client.from('donations').select('*').order('created_at', { ascending: false }),
            client.from('gallery').select('*').order('created_at', { ascending: false }),
            client.from('categories').select('*').order('name', { ascending: true }),
            client.from('hero_slides').select('*').order('id', { ascending: true })
          ]);

          if (!progRes.error && progRes.data && progRes.data.length > 0) {
            setPrograms(progRes.data.map(p => ({
              id: String(p.id),
              title: p.title || 'Tanpa Judul',
              category: p.category || 'Pendidikan',
              description: p.description || '',
              fullContent: p.full_content || p.description || '',
              targetAmount: Number(p.target_amount || 0),
              currentAmount: Number(p.current_amount || 0),
              beneficiaries: Number(p.beneficiaries || 0),
              imageUrl: p.image_url || 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80',
              status: p.status || 'Aktif'
            })));
          }

          if (!catRes.error && catRes.data && catRes.data.length > 0) {
            setCategories(catRes.data.map(c => ({
              id: String(c.id),
              name: c.name || '',
              description: c.description || ''
            })));
          }

          if (!donRes.error && donRes.data && donRes.data.length > 0) {
            setDonations(donRes.data.map(d => ({
              id: String(d.id),
              donorName: d.donor_name || 'Hamba Allah',
              phone: d.donor_phone || '',
              amount: Number(d.amount || 0),
              programTitle: d.program_title || 'Infaq Umum',
              paymentMethod: d.payment_method || 'Transfer Bank',
              status: d.status || 'Terverifikasi',
              created_at: d.created_at || new Date().toISOString(),
              notes: d.notes || ''
            })));
          }

          if (!galRes.error && galRes.data && galRes.data.length > 0) {
            setGallery(galRes.data.map(g => ({
              id: String(g.id),
              title: g.title || '',
              category: g.category || 'Dokumentasi',
              description: g.description || '',
              imageUrl: g.image_url || ''
            })));
          }

          if (!sliRes.error && sliRes.data && sliRes.data.length > 0) {
            setSlides(sliRes.data.map(s => ({
              id: s.id,
              bg_image: s.bg_image || s.bg_url || s.bgImage || "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=1600&q=80",
              overlay_opacity: Number(s.overlay_opacity ?? s.overlayOpacity ?? 0.55),
              title: s.title || '',
              title_pos_x: Number(s.title_pos_x ?? s.titlePos?.x ?? 50),
              title_pos_y: Number(s.title_pos_y ?? s.titlePos?.y ?? 38),
              title_size: Number(s.title_size ?? s.titleSize ?? 28),
              title_color: s.title_color || s.titleColor || "#ffffff",
              title_align: s.title_align || s.titleAlign || "center",
              subtitle: s.subtitle || '',
              subtitle_pos_x: Number(s.subtitle_pos_x ?? s.subtitlePos?.x ?? 50),
              subtitle_pos_y: Number(s.subtitle_pos_y ?? s.subtitlePos?.y ?? 62),
              subtitle_size: Number(s.subtitle_size ?? s.subtitleSize ?? 13),
              subtitle_color: s.subtitle_color || s.subtitleColor || "#f1f5f9",
              subtitle_align: s.subtitle_align || s.subtitleAlign || "center"
            })));
          }

          if (isManual) showNotification("Data Supabase berhasil disinkronkan!");
        } catch (e) {
          console.warn("Sinkronisasi bermasalah:", e);
        } finally {
          setIsSyncing(false);
        }

        getSupabase();
        syncFromSupabase(false);

        return donations

          if (new Date(d.created_at) > new Date(existing.lastDate)) {
            existing.lastDate = d.created_at;
            existing.lastProgram = d.programTitle;

          map.set(key, existing);

    function DashboardView({ totalInfaq, totalDonatur, activeProgramsCount, totalProgramsCount, donations }) {
      const today = new Date();
      const thirtyDaysAgo = new Date(today.getTime() - 29 * 86400000);

      const [startDate, setStartDate] = useState(getFormattedDateString(thirtyDaysAgo));
      const [endDate, setEndDate] = useState(getFormattedDateString(today));
      const [hoveredPoint, setHoveredPoint] = useState(null);

      const chartData = useMemo(() => {
        const start = new Date(startDate);
        const end = new Date(endDate);
        end.setHours(23, 59, 59, 999);

        const map = new Map();
        let curr = new Date(start);
        while (curr <= end) {
          const key = getFormattedDateString(curr);
          map.set(key, { dateKey: key, displayDate: curr.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }), total: 0, count: 0 });
          curr.setDate(curr.getDate() + 1);
        }

        donations.forEach(d => {
          if (d.status !== 'Terverifikasi') return;
          const dDate = new Date(d.created_at);
          const key = getFormattedDateString(dDate);
          if (map.has(key)) {
            const entry = map.get(key);
            entry.total += Number(d.amount || 0);
            entry.count += 1;
          }
        });

        return Array.from(map.values());
      }, [donations, startDate, endDate]);

      const maxChartValue = useMemo(() => {
        const max = Math.max(...chartData.map(d => d.total), 0);
        return max > 0 ? max : 1000000;
      }, [chartData]);

      const rangeTotal = useMemo(() => {
        return chartData.reduce((acc, curr) => acc + curr.total, 0);
      }, [chartData]);

      const setQuickPreset = (days) => {
        const e = new Date();
        const s = new Date(e.getTime() - (days - 1) * 86400000);
        setStartDate(getFormattedDateString(s));
        setEndDate(getFormattedDateString(e));
      };

      return (
        <div className="space-y-8 animate-fade-in">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
              <div>
                <div className="text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Total Infaq Terkumpul</div>
                <div className="text-2xl font-black text-slate-900 tracking-tight">{formatIDR(totalInfaq)}</div>
              </div>
              <div className="text-xs font-bold text-emerald-600 mt-4 flex items-center space-x-1">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Terverifikasi di sistem</span>
              </div>
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
              <div>
                <div className="text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Total Donatur</div>
                <div className="text-2xl font-black text-slate-900 tracking-tight">{totalDonatur} Donatur</div>
              </div>
              <div className="text-xs font-medium text-slate-400 mt-4">Donatur aktif terdaftar</div>
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
              <div>
                <div className="text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Program Aktif</div>
                <div className="text-2xl font-black text-[#B89355] tracking-tight">{activeProgramsCount} Program</div>
              </div>
              <div className="text-xs font-medium text-slate-400 mt-4">Dari total {totalProgramsCount} program</div>
            </div>
          </div>

          <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-5">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="p-2 bg-emerald-50 text-[#1F5946] rounded-xl"><Icons.Calendar /></span>
                  <h2 className="text-lg font-bold text-slate-900">Grafik Perkembangan Infaq Masuk</h2>
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  Total infaq periode terpilih: <span className="font-bold text-[#1F5946]">{formatIDR(rangeTotal)}</span>
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center space-x-2 bg-slate-50 p-2 rounded-2xl border border-slate-200 text-xs">
                  <div className="flex items-center space-x-1">
                    <span className="text-[10px] font-bold text-slate-400 uppercase">Dari:</span>
                    <input 
                      type="date" 
                      value={startDate} 
                      onChange={(e) => setStartDate(e.target.value)}
                      className="bg-transparent font-semibold text-slate-800 outline-none cursor-pointer"
                    />
                  </div>
                  <span className="text-slate-300">-</span>
                  <div className="flex items-center space-x-1">
                    <span className="text-[10px] font-bold text-slate-400 uppercase">S/D:</span>
                    <input 
                      type="date" 
                      value={endDate} 
                      onChange={(e) => setEndDate(e.target.value)}
                      className="bg-transparent font-semibold text-slate-800 outline-none cursor-pointer"
                    />
                  </div>
                </div>

                <div className="flex space-x-1 bg-slate-100 p-1 rounded-2xl text-[11px] font-bold">
                  <button onClick={() => setQuickPreset(7)} className="px-3 py-1.5 rounded-xl hover:bg-white text-slate-700 transition">7 Hari</button>
                  <button onClick={() => setQuickPreset(14)} className="px-3 py-1.5 rounded-xl hover:bg-white text-slate-700 transition">14 Hari</button>
                  <button onClick={() => setQuickPreset(30)} className="px-3 py-1.5 rounded-xl hover:bg-white text-slate-700 transition">30 Hari</button>
                </div>
              </div>
            </div>

            <div className="relative pt-4 pb-2">
              <div className="h-64 w-full flex items-end justify-between space-x-1.5 sm:space-x-3 px-2 border-b border-slate-200">
                {chartData.map((d, idx) => {
                  const heightPercent = maxChartValue > 0 ? Math.max((d.total / maxChartValue) * 100, 4) : 4;
                  const isHovered = hoveredPoint?.dateKey === d.dateKey;

                  return (
                    <div 
                      key={d.dateKey || idx}
                      onMouseEnter={() => setHoveredPoint(d)}
                      onMouseLeave={() => setHoveredPoint(null)}
                      className="flex-1 flex flex-col items-center h-full justify-end group cursor-pointer relative"
                    >
                      {isHovered && (
                        <div className="absolute -top-14 z-20 bg-slate-900 text-white px-3 py-1.5 rounded-xl text-[10.5px] font-bold shadow-xl whitespace-nowrap animate-fade-in pointer-events-none">
                          <div>{d.displayDate} ({d.count} transaksi)</div>
                          <div className="text-[#D4AF37]">{formatIDR(d.total)}</div>
                        </div>
                      )}

                      <div 
                        className={`w-full rounded-t-lg transition-all duration-300 ${
                          d.total > 0 
                            ? (isHovered ? 'bg-[#B89355] shadow-lg scale-105' : 'bg-[#1F5946] hover:bg-[#174435]')
                            : 'bg-slate-100 hover:bg-slate-200'
                        }`}
                        style={{ height: `${heightPercent}%` }}
                      ></div>
                    </div>
                  );
                })}
              </div>

              <div className="flex justify-between text-[10px] font-bold text-slate-400 mt-3 px-1">
                <span>{chartData[0]?.displayDate}</span>
                <span>{chartData[Math.floor(chartData.length / 2)]?.displayDate}</span>
                <span>{chartData[chartData.length - 1]?.displayDate}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

      );
    }

    function AiAssistantView({ programs, showNotification }) {
      const [aiTopic, setAiTopic] = useState("");
      const [selectedProgTitle, setSelectedProgTitle] = useState(programs[0]?.title || "");
      const chatEndRef = useRef(null);

      const [chatMessages, setChatMessages] = useState([
        {
          id: 'welcome-msg',
          sender: 'ai',
          text: 'Assalamu\'alaikum! Saya adalah Asisten Amil AI Lembaga Infaq Nurul Hayah. Pilih program atau ketik instruksi khusus untuk pembuatan deskripsi, pesan broadcast WA, atau caption medsos tanpa emoji.',
          timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        }
      ]);

      const copyToClipboard = (textToCopy) => {
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification("Teks disalin ke clipboard!");
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-amber-50 border border-amber-200 text-amber-600 flex items-center justify-center">
                <Icons.AiMagic />
              </div>
              <div>
                <h2 className="text-base font-bold text-slate-900">Amil AI Generator</h2>
                <p className="text-xs text-slate-400">Pilih program & buat konten promosi infaq dengan mudah.</p>
              </div>
            </div>

            <div className="grid sm:grid-cols-2 gap-3">
              <div>
                <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Pilih Program Terdaftar</label>
                <select
                  value={selectedProgTitle}
                  onChange={(e) => { setSelectedProgTitle(e.target.value); setAiTopic(e.target.value); }}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none"
                >
                  <option value="">-- Pilih Program --</option>
                  {programs.map(p => (
                    <option key={p.id} value={p.title}>{p.title}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Atau Tuliskan Topik Kustom</label>
                <input 
                  type="text" 
                  placeholder="Misal: Sedekah Subuh Santri Hafiz"
                  value={aiTopic}
                  onChange={(e) => setAiTopic(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none"
                />
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden flex flex-col h-[480px]">
            <div className="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center text-xs font-bold text-slate-700">
              <span>Ruang Diskusi Amil AI</span>
              <span className="text-[10px] text-slate-400 font-normal">Bebas Emoji • Bahasa Amanah</span>
            </div>

            <div className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
              {chatMessages.map(msg => (
                <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`max-w-[85%] rounded-2xl p-4 text-xs font-medium leading-relaxed shadow-sm ${
                    msg.sender === 'user' ? 'bg-[#1F5946] text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none border border-slate-200'
                  }`}>
                    <div className="whitespace-pre-wrap">{msg.text}</div>
                    {msg.sender === 'ai' && (
                      <button onClick={() => copyToClipboard(msg.text)} className="mt-3 inline-flex items-center space-x-1 px-2.5 py-1 bg-white border border-slate-200 text-slate-700 text-[10px] font-bold rounded-lg"><Icons.Copy /><span>Salin Teks</span></button>
                    )}
                  </div>
                  <span className="text-[9.5px] text-slate-400 mt-1 px-1">{msg.timestamp}</span>
                </div>
              ))}
              <div ref={chatEndRef} />
            </div>
          </div>
        </div>
      );
    }

    function HeroSlideEditorView({ slides, setSlides, activeSlideIdx, setActiveSlideIdx, showNotification, getSupabase }) {
      const currentSlide = slides[activeSlideIdx] || slides[0] || {};

      const updateCurrentSlide = (fields) => {
        setSlides(prev => prev.map((s, idx) => idx === activeSlideIdx ? { ...s, ...fields } : s));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onloadend = () => {
          updateCurrentSlide({ bg_image: reader.result });
          showNotification("Gambar berhasil diunggah ke slide!");
        };
        reader.readAsDataURL(file);
      };

      const handleSaveAllSlides = async () => {
        showNotification("Menyimpan slide hero...");
        const client = getSupabase();
        if (client) {
          try {
            await client.from('hero_slides').delete().neq('id', 0);
            await client.from('hero_slides').insert(slides.map((s, i) => ({
              id: i + 1,
              bg_image: s.bg_image,
              overlay_opacity: s.overlay_opacity,
              title: s.title,
              title_pos_x: s.title_pos_x,
              title_pos_y: s.title_pos_y,
              title_size: s.title_size,
              title_color: s.title_color,
              title_align: s.title_align,
              subtitle: s.subtitle,
              subtitle_pos_x: s.subtitle_pos_x,
              subtitle_pos_y: s.subtitle_pos_y,
              subtitle_size: s.subtitle_size,
              subtitle_color: s.subtitle_color,
              subtitle_align: s.subtitle_align
            })));
          } catch (e) {
            console.warn("Gagal simpan ke Supabase:", e);
          }
        }
        showNotification("Slide Hero berhasil dikunci & disimpan!");
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              {slides.map((s, idx) => (
                <button 
                  key={idx} 
                  onClick={() => setActiveSlideIdx(idx)} 
                  className={`px-4 py-2 rounded-2xl text-xs font-bold transition flex items-center space-x-1.5 ${
                    idx === activeSlideIdx ? 'bg-[#1F5946] text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  <span>Slide #{idx + 1}</span>
                </button>
              ))}
            </div>

            <button
              onClick={handleSaveAllSlides}
              className="px-5 py-2.5 bg-[#B89355] hover:bg-[#a37e43] text-white rounded-2xl text-xs font-extrabold shadow-md flex items-center space-x-2 transition"
            >
              <Icons.Save />
              <span>Simpan Slide</span>
            </button>
          </div>

          <div className="bg-slate-900 rounded-3xl overflow-hidden shadow-2xl relative border-4 border-slate-800">
            <div className="p-3 bg-slate-950 text-slate-400 text-[10.5px] font-bold flex justify-between items-center border-b border-slate-800">
              <span>Preview Slide #{activeSlideIdx + 1}</span>
              <span>Live Preview</span>
            </div>

            <div className="relative h-64 sm:h-80 w-full overflow-hidden bg-slate-950">
              <img 
                src={currentSlide.bg_image} 
                alt="Slide Preview"
                className="w-full h-full object-cover"
              />
              <div 
                className="absolute inset-0 bg-black pointer-events-none transition-opacity"
                style={{ opacity: currentSlide.overlay_opacity ?? 0.55 }}
              ></div>

              <div
                className="absolute transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-2xl pointer-events-none px-2"
                style={{
                  left: `${currentSlide.title_pos_x ?? 50}%`,
                  top: `${currentSlide.title_pos_y ?? 38}%`,
                  textAlign: currentSlide.title_align || 'center'
                }}
              >
                <h2 
                  className="font-black drop-shadow-md leading-tight"
                  style={{
                    fontSize: `${Math.max(14, (currentSlide.title_size || 28) * 0.7)}px`,
                    color: currentSlide.title_color || '#ffffff'
                  }}
                >
                  {currentSlide.title || "Judul Slide"}
                </h2>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 className="font-bold text-slate-900 text-sm border-b pb-2">Foto Background Slide</h3>
            <div>
              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Upload dari Komputer / HP</label>
              <input 
                type="file" 
                accept="image/*"
                onChange={handleFileUpload}
                className="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-[#1F5946]"
              />
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
