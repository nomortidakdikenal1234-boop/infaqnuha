    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [settings, setSettings] = useState(INITIAL_SETTINGS);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [programs, setPrograms] = useState([]);
      const [donations, setDonations] = useState([]);
      const [gallery, setGallery] = useState([]);
      const [logs, setLogs] = useState([
        { id: "1", title: "Sistem Admin Infaq diinisialisasi", meta: `${new Date().toLocaleTimeString('id-ID')} • Kunci Supabase Terpasang` }
      ]);

      const [supabaseUrl, setSupabaseUrl] = useState(DEFAULT_SUPABASE_URL);
      const [supabaseKey, setSupabaseKey] = useState(DEFAULT_SUPABASE_KEY);
      const [dbStatus, setDbStatus] = useState("connecting");
      const [dbMessage, setDbMessage] = useState("");
      const [isSyncing, setIsSyncing] = useState(false);
      const [toast, setToast] = useState(null);

      // Modal Input Form
      const [showProgramModal, setShowProgramModal] = useState(false);
      const [showInfaqModal, setShowInfaqModal] = useState(false);
      const [showGalleryModal, setShowGalleryModal] = useState(false);
      const [showCategoryModal, setShowCategoryModal] = useState(false);

      // Mode Input Foto (Upload File vs Link URL)
      const [programImageMode, setProgramImageMode] = useState('upload');
      const [galleryImageMode, setGalleryImageMode] = useState('upload');

      // Modal Konfirmasi Hapus Kustom
      const [deleteModal, setDeleteModal] = useState({
        isOpen: false,
        type: null,
        id: null,
        title: ''
      });

      // Form State
      const [programForm, setProgramForm] = useState({
        title: '',
        category: 'Pendidikan',
        description: '',
        fullContent: '',
        targetAmount: '',
        beneficiaries: '',
        imageUrl: '',
        status: 'Aktif'
      });

      const [infaqForm, setInfaqForm] = useState({
        donorName: '',
        phone: '',
        programTitle: '',
        amount: '',
        paymentMethod: 'Transfer Bank',
        status: 'Terverifikasi',
        notes: ''
      });

      const [galleryForm, setGalleryForm] = useState({
        title: '',
        category: 'Pendidikan',
        description: '',
        imageUrl: ''
      });

      const [categoryForm, setCategoryForm] = useState({
        name: '',
        description: ''
      });

      const supabaseRef = useRef(null);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const addLog = (title, metaInfo = "Oleh Admin") => {
        const newLog = {
          id: String(Date.now()),
          title,
          meta: `${new Date().toLocaleTimeString('id-ID')} • ${metaInfo}`
        };
        setLogs(prev => [newLog, ...prev.slice(0, 9)]);
      };

      // Handler Memproses File Gambar (Maksimal 5MB)
      const handleProcessImageUpload = (file, onSuccess) => {
        if (!file) return;

        const maxSizeBytes = 5 * 1024 * 1024;
        if (file.size > maxSizeBytes) {
          showNotification(`Gagal: Ukuran file (${(file.size / (1024 * 1024)).toFixed(2)} MB) melebihi batas 5 MB!`);
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDimension = 1400;
            let width = img.width;
            let height = img.height;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const optimizedDataUrl = canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
            onSuccess(optimizedDataUrl);
            showNotification("Foto berhasil dipilih & siap disimpan!");
          };

          img.onerror = () => {
            onSuccess(e.target.result);
            showNotification("Foto berhasil dipilih!");
          };

          img.src = e.target.result;
        };

        reader.readAsDataURL(file);
      };

      // Inisialisasi Supabase Client
      const getSupabase = () => {
        if (!supabaseRef.current && window.supabase && supabaseUrl && supabaseKey) {
          try {
            supabaseRef.current = window.supabase.createClient(supabaseUrl.trim(), supabaseKey.trim());
          } catch (e) {
            console.error("Gagal createClient:", e);
          }
        }
        return supabaseRef.current;
      };

      // Tarik data langsung dari Supabase
      const syncFromSupabase = async (isManual = false) => {
        setIsSyncing(true);
        const client = getSupabase();

        if (!client) {
          setDbStatus("error");
          setDbMessage("Supabase JS belum siap");
          setIsSyncing(false);
          return;
        }

        try {
          const [progRes, donRes, galRes, setRes, catRes] = await Promise.all([
            client.from('programs').select('*').order('created_at', { ascending: false }),
            client.from('donations').select('*').order('created_at', { ascending: false }),
            client.from('gallery').select('*').order('created_at', { ascending: false }),
            client.from('settings').select('*').limit(1).maybeSingle(),
            client.from('categories').select('*').order('name', { ascending: true })
          ]);

          if (progRes.error && progRes.error.code === '42P01') {
            setDbStatus("not_ready");
            setDbMessage("Tabel SQL belum dibuat di Supabase");
            if (isManual) showNotification("Koneksi Supabase OK, tapi tabel belum dibuat. Silakan cek tab Pengaturan.");
            setIsSyncing(false);
            return;
          }

          let anySuccess = false;

          // 0. Categories
          if (!catRes.error && catRes.data && catRes.data.length > 0) {
            anySuccess = true;
            setCategories(catRes.data.map(c => ({
              id: String(c.id),
              name: c.name || 'Kategori',
              description: c.description || ''
            })));
          }

          // 1. Programs
          if (!progRes.error && progRes.data) {
            anySuccess = true;
            setPrograms(progRes.data.map(p => ({
              id: String(p.id),
              title: p.title || 'Tanpa Judul',
              category: p.category || 'Pendidikan',
              description: p.description || '',
              fullContent: p.full_content || p.description || '',
              targetAmount: Number(p.target_amount || 0),
              currentAmount: Number(p.current_amount || 0),
              beneficiaries: Number(p.beneficiaries || 0),
              imageUrl: p.image_url || 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80',
              status: p.status || 'Aktif'
            })));
          }

          // 2. Donations
          if (!donRes.error && donRes.data) {
            anySuccess = true;
            setDonations(donRes.data.map(d => ({
              id: String(d.id),
              donorName: d.donor_name || 'Hamba Allah',
              phone: d.donor_phone || '',
              amount: Number(d.amount || 0),
              programTitle: d.program_title || 'Infaq Umum',
              paymentMethod: d.payment_method || 'Transfer Bank',
              status: d.status || 'Terverifikasi',
              date: d.created_at ? new Date(d.created_at).toLocaleString('id-ID') : new Date().toLocaleString('id-ID'),
              notes: d.notes || ''
            })));
          }

          // 3. Gallery
          if (!galRes.error && galRes.data) {
            anySuccess = true;
            setGallery(galRes.data.map(g => ({
              id: String(g.id),
              title: g.title || '',
              category: g.category || 'Dokumentasi',
              description: g.description || '',
              imageUrl: g.image_url || ''
            })));
          }

          // 4. Settings
          if (!setRes.error && setRes.data) {
            anySuccess = true;
            setSettings(prev => ({
              ...prev,
              orgName: setRes.data.org_name || prev.orgName,
              whatsapp: setRes.data.whatsapp || prev.whatsapp,
              email: setRes.data.email || prev.email,
              address: setRes.data.address || prev.address,
              tagline: setRes.data.tagline || prev.tagline
            }));
          }

          if (anySuccess || (!progRes.error && !donRes.error)) {
            setDbStatus("connected");
            setDbMessage("Terhubung ke Supabase");
            if (isManual) showNotification("Data Supabase berhasil disinkronkan!");
          } else {
            setDbStatus("not_ready");
            setDbMessage("Tabel belum tersedia");
          }
        } catch (e) {
          console.error("Gagal sinkronisasi Supabase:", e);
          setDbStatus("error");
          setDbMessage("Gagal terhubung");
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        supabaseRef.current = null;
        getSupabase();
        syncFromSupabase(false);
      }, [supabaseUrl, supabaseKey]);

      // Statistik Perhitungan Realtime
      const totalInfaq = useMemo(() => {
        return donations
          .filter(d => d.status === 'Terverifikasi')
          .reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
      }, [donations]);

      const totalDonatur = useMemo(() => {
        const uniqueNames = new Set(donations.map(d => (d.donorName || '').trim()));
        return donations.length === 0 ? 0 : Math.max(uniqueNames.size, donations.length);
      }, [donations]);

      const activePrograms = useMemo(() => {
        return programs.filter(p => p.status === 'Aktif');
      }, [programs]);

      const danaTersalurkan = useMemo(() => {
        return Math.round(totalInfaq * 0.85);
      }, [totalInfaq]);

      // ================= CRUD KATEGORI =================
      const handleCreateCategory = async (e) => {
        e.preventDefault();
        const catName = categoryForm.name.trim();
        if (!catName) {
          showNotification("Nama kategori tidak boleh kosong");
          return;
        }

        // Cek duplikasi
        if (categories.some(c => c.name.toLowerCase() === catName.toLowerCase())) {
          showNotification("Kategori dengan nama tersebut sudah ada!");
          return;
        }

        const newCat = {
          id: `CAT-${Date.now()}`,
          name: catName,
          description: categoryForm.description.trim() || 'Kategori Program Infaq'
        };

        setCategories(prev => [...prev, newCat]);
        setProgramForm(prev => ({ ...prev, category: newCat.name }));
        setGalleryForm(prev => ({ ...prev, category: newCat.name }));
        setShowCategoryModal(false);
        addLog(`Kategori baru: "${newCat.name}"`);
        showNotification(`Kategori "${newCat.name}" berhasil ditambahkan!`);

        const client = getSupabase();
        if (client) {
          try {
            await client.from('categories').insert([{
              id: newCat.id,
              name: newCat.name,
              description: newCat.description
            }]);
          } catch (err) {
            console.error("Gagal simpan kategori ke Supabase:", err);
          }
        }

        setCategoryForm({ name: '', description: '' });
      };

      // ================= CRUD PROGRAM =================
      const handleCreateProgram = async (e) => {
        e.preventDefault();
        const targetClean = parseCleanNumber(programForm.targetAmount);

        const newProg = {
          id: `PROG-${Date.now()}`,
          title: programForm.title.trim(),
          category: programForm.category || (categories[0]?.name || 'Pendidikan'),
          description: programForm.description.trim(),
          fullContent: programForm.fullContent || programForm.description,

          currentAmount: 0,
          beneficiaries: Number(programForm.beneficiaries) || 0,

        setPrograms(prev => [newProg, ...prev]);
        setShowProgramModal(false);
        addLog(`Program baru: "${newProg.title}"`);
        showNotification("Program berhasil dibuat!");

        const client = getSupabase();
        if (client) {
          try {
            await client.from('programs').insert([{
              id: newProg.id,
              title: newProg.title,
              category: newProg.category,

              beneficiaries: newProg.beneficiaries,

              status: newProg.status

          } catch (err) {
            console.error("Gagal insert program ke Supabase:", err);

        }

        setProgramForm({
          title: '',
          category: categories[0]?.name || 'Pendidikan',
          description: '',
          fullContent: '',
          targetAmount: '',
          beneficiaries: '',
          imageUrl: '',

      };

      const handleToggleProgramStatus = async (prog) => {

          phone: infaqForm.phone.trim() || "-",

          paymentMethod: infaqForm.paymentMethod,
          status: infaqForm.status,
          date: new Date().toLocaleString('id-ID'),
          notes: infaqForm.notes.trim() || ""

        setDonations(prev => [newTrx, ...prev]);

                        ) : (
                          <div className="py-2">
                            <div className="w-8 h-8 rounded-full bg-emerald-50 text-[#1F5946] flex items-center justify-center mx-auto mb-1.5">
                              <Icons.Upload />
                            </div>
                            <p className="text-xs font-bold text-slate-700">Pilih Foto dari Galeri / Kamera</p>
                            <p className="text-[10px] text-slate-400 mt-0.5">JPG, PNG, WEBP (Maksimal 5 MB)</p>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="space-y-2">
                        <input 
                          type="url" 
                          required={galleryImageMode === 'url'}
                          placeholder="https://images.unsplash.com/..."
                          value={galleryForm.imageUrl}
                          onChange={(e) => setGalleryForm({ ...galleryForm, imageUrl: e.target.value })}
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-[#1F5946]"
                        />
                        {galleryForm.imageUrl && (
                          <div className="flex items-center space-x-2 text-[10px] text-slate-500">
                            <img src={galleryForm.imageUrl} alt="Preview" className="w-7 h-7 rounded-md object-cover border" onError={(e) => e.target.style.display = 'none'} />
                            <span>Pratinjau link foto</span>
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Keterangan Singkat</label>
                    <input 
                      type="text" 
                      placeholder="Lokasi atau penerima manfaat"
                      value={galleryForm.description}
                      onChange={(e) => setGalleryForm({ ...galleryForm, description: e.target.value })}
                      className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-[#1F5946]"
                    />
                  </div>

                  <div className="flex justify-end space-x-3 pt-2">
                    <button type="button" onClick={() => setShowGalleryModal(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600">Batal</button>
                    <button type="submit" className="px-5 py-2 bg-[#1F5946] text-white text-xs font-bold rounded-xl">Simpan Foto</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
