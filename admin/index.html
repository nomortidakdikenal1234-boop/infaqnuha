<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINUHA Panel</title>
    <!-- Favicon Website -->
    <link rel="icon" type="image/jpeg" href="https://www.upload.ee/image/19930797/Primary_Logo_1.jpg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nuha: { primary: '#286B56', dark: '#144e36', gold: '#B99A62' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Gold Shimmer Button Animation */
        @keyframes shimmerSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 215, 0, 0.45) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-20deg);
            animation: shimmerSlide 2.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen">

    <div id="admin-root" class="w-full min-h-screen flex">
        <!-- Admin App Rendered via JS -->
    </div>

    <script>
        const OFFICIAL_LOGO = "https://www.upload.ee/image/19930797/Primary_Logo_1.jpg";

        // Shared LocalStorage Database
        let DB = JSON.parse(localStorage.getItem('NUHA_DATABASE')) || {

                siteLogo: OFFICIAL_LOGO,

                isLocked: false,
                lockMessage: "Website sedang dalam pemeliharaan sistem. Silakan kembali beberapa saat lagi.",
                disableDonations: false,
                socials: {
                    whatsapp: "https://wa.me/6282333362299",
                    instagram: "https://www.instagram.com/lembagainfaqnurulhayah",
                    youtube: "https://youtube.com",
                    tiktok: "https://tiktok.com",
                    facebook: "https://facebook.com"
                },
                welcomeMessage: "Assalamu'alaikum. Ada yang bisa dibantu?"
            },

                { id: 1, name: "Bank Syariah Indonesia (BSI)", account: "7123-4567-89 a.n NUHA", qrImage: "", active: true },

                { id: 3, name: "QRIS All Payment Resmi NUHA", account: "Scan Barcode QRIS Sangat Mudah", qrImage: "https://placehold.co/400x400/286B56/FFFFFF?text=QRIS+NUHA", active: true }
            ],

                { id: 2, nama: "H. Ahmad Fauzi, M.Pd.", jabatan: "Ketua Pengurus Lembaga", foto: "", level: 2 },
                { id: 3, nama: "Siti Rahmah, S.E., Ak.", jabatan: "Bendahara & Keuangan", foto: "", level: 3 }
            ],
            stats: { totalInfaq: 248500000, totalDonatur: 1420 },
            heroSlides: [
                {
                    id: 1,
                    foto: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=1920&q=80",
                    judul: "Bekali Pendidikan, Kuatkan Masa Depan Santri!",
                    subjudul: "Mari raih keberkahan bersama Lembaga Infaq Nurul Hayah."
                },
                {
                    id: 2,
                    foto: "https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&w=1920&q=80",
                    judul: "Pembangunan Gedung Asrama Santri",
                    subjudul: "Fasilitas tempat tinggal yang layak, bersih, dan amanah bagi penghafal Al-Qur'an."
                }
            ],
            gallery: [
                { id: 1, judul: "Kajian Rutin Bersama Pengasuh", ket: "Kegiatan rutin santri bersama pembina utama", foto: "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=800&q=80", tanggal: "2026-10-20" }
            ],
            pengurusList: [
                { id: 1, nama: "Dr. KH. Ja'far Ath-Thayyar, Lc., M.A.", jabatan: "Pengasuh & Pembina Utama", foto: "" },
                { id: 2, nama: "H. Ahmad Fauzi, M.Pd.", jabatan: "Ketua Pengurus Lembaga", foto: "" },
                { id: 3, nama: "Siti Rahmah, S.E., Ak.", jabatan: "Bendahara & Keuangan", foto: "" }
            ],
            stats: { totalInfaq: 248500000, totalDonatur: 1420 },
            heroSlides: [
                {
                    foto: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=1920&q=80",
                    judul: "Bekali Pendidikan, Kuatkan Masa Depan Santri!",
                    subjudul: "Mari raih keberkahan bersama Lembaga Infaq Nurul Hayah."
                }
            ],
            gallery: [],
            programs: [],
            news: [],
            donations: []
        };

        function saveDB() {
            localStorage.setItem('NUHA_DATABASE', JSON.stringify(DB));
        }

        let adminState = {
            adminSubTab: 'dashboard',
            isLoggedIn: sessionStorage.getItem('NUHA_ADMIN_AUTH') === 'true'
        };

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function renderAdminApp() {
            const root = document.getElementById('admin-root');
            root.innerHTML = '';

            if (!adminState.isLoggedIn) {
                root.appendChild(renderAdminLoginPage());
            } else {
                root.appendChild(renderAdminDashboard());
            }

            if (window.lucide) lucide.createIcons();
        }

        // GREEN BACKGROUND LOGIN PAGE FOR ADMIN
        function renderAdminLoginPage() {
            const container = document.createElement('div');
            container.className = "w-full min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0f4e2b] via-[#146438] to-[#0a381e]";
            container.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl space-y-6">
                    <div class="text-center space-y-2">
                        <img src="${DB.settings.siteLogo || OFFICIAL_LOGO}" class="h-14 mx-auto object-contain bg-emerald-50 p-1.5 rounded-2xl">
                        <h2 class="text-xl font-bold font-poppins text-gray-900">${DB.settings.siteName || 'Lembaga Infaq Nurul Hayah'}</h2>
                        <p class="text-xs text-gray-500 font-medium">Manage Website Infaq</p>
                    </div>

                    <form onsubmit="event.preventDefault(); processAdminLogin();" class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-gray-700">Kode Akses / Kata Sandi Admin</label>
                            <input type="password" id="admin-pass" placeholder="Masukkan password admin..." class="w-full mt-1 p-3.5 border border-gray-200 rounded-2xl text-xs focus:ring-2 focus:ring-nuha-primary focus:outline-none" required>
                        </div>
                        <button type="submit" class="btn-shimmer w-full py-3.5 bg-[#146438] hover:bg-[#0f4e2b] text-white font-bold text-sm rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
                            <span>Masuk</span> &rarr;
                        </button>
                    </form>
                </div>
            `;
            return container;
        }

        function processAdminLogin() {
            const pass = document.getElementById('admin-pass')?.value;
            if (pass === 'infaqnuha2025' || pass === 'adminnuha') {
                adminState.isLoggedIn = true;
                sessionStorage.setItem('NUHA_ADMIN_AUTH', 'true');
                renderAdminApp();
            } else {
                alert('Sandi Admin Salah! Gunakan: infaqnuha2025');
            }
        }

            container.className = "flex w-full min-h-screen";

                        <nav class="space-y-1 text-xs font-semibold">

                            <button onclick="setAdminTab('settings')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='settings'?'bg-white/20':''}">Pengaturan Website & Lock</button>
                            <button onclick="setAdminTab('heroSlides')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='heroSlides'?'bg-white/20':''}">Hero Slide & Teks</button>
                            <button onclick="setAdminTab('pengurus')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='pengurus'?'bg-white/20':''}">Susunan Pengurus</button>
                            <button onclick="setAdminTab('program')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='program'?'bg-white/20':''}">Kelola Program Unggulan</button>
                            <button onclick="setAdminTab('gallery')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='gallery'?'bg-white/20':''}">Kelola Galeri Foto</button>
                            <button onclick="setAdminTab('berita')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='berita'?'bg-white/20':''}">Berita & Embed Media</button>
                            <button onclick="setAdminTab('pembayaran')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='pembayaran'?'bg-white/20':''}">Metode Pembayaran</button>

                    </div>

                    ${adminState.adminSubTab === 'dashboard' ? `
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

                                <span class="text-xs text-gray-400">Total Donasi Terkumpul</span>
                                <h3 class="text-2xl font-bold text-nuha-primary mt-1">${formatRupiah(DB.stats.totalInfaq)}</h3>
                            </div>
                            <div class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm">
                                <span class="text-xs text-gray-400">Total Donatur</span>
                                <h3 class="text-2xl font-bold text-gray-900 mt-1">${DB.stats.totalDonatur} Orang</h3>
                            </div>
                            <div class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm">
                                <span class="text-xs text-gray-400">Status Akses Website</span>
                                <h3 class="text-lg font-bold ${DB.settings.isLocked?'text-red-600':'text-emerald-600'} mt-1">${DB.settings.isLocked ? 'Terkunci (Maintenance)' : 'Aktif Publik'}</h3>
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'settings' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6 max-w-3xl">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Pengaturan Identitas & Kontrol Akses</h3>
                            
                            <div class="space-y-4">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Nama Website</label>
                                        <input type="text" id="set-site-name" value="${DB.settings.siteName}" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Nomor Telepon / WA</label>
                                        <input type="text" id="set-phone" value="${DB.settings.phone}" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-gray-700">URL Logo Website</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="set-logo-url" value="${DB.settings.siteLogo}" class="flex-1 p-3 border border-gray-200 rounded-xl text-xs">
                                        <input type="file" id="logo-file-input" onchange="uploadImageFile(this, 'set-logo-url')" class="hidden">
                                        <button onclick="document.getElementById('logo-file-input').click()" class="px-4 py-2 bg-gray-100 border text-xs font-bold rounded-xl hover:bg-gray-200">Upload Foto</button>
                                    </div>
                                </div>

                                <div class="pt-4 border-t space-y-3">
                                    <h4 class="font-bold text-xs text-gray-800">Link Sosial Media</h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <input type="text" id="soc-wa" placeholder="WhatsApp Link" value="${DB.settings.socials?.whatsapp || ''}" class="p-3 border rounded-xl text-xs">

                                        <input type="text" id="soc-tiktok" placeholder="TikTok Link" value="${DB.settings.socials?.tiktok || ''}" class="p-3 border rounded-xl text-xs">
                                        <input type="text" id="soc-fb" placeholder="Facebook Link" value="${DB.settings.socials?.facebook || ''}" class="p-3 border rounded-xl text-xs">
                                    </div>
                                </div>

                                <div class="pt-4 border-t space-y-4">
                                    <h4 class="font-bold text-xs text-gray-800">Kontrol Kunci Website & Tombol</h4>
                                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl">
                                        <div>
                                            <span class="font-bold text-xs text-gray-900 block">Kunci Seluruh Website (Maintenance Mode)</span>
                                            <span class="text-[10px] text-gray-500">Pengunjung tidak bisa membuka website saat ini</span>
                                        </div>
                                        <input type="checkbox" id="set-is-locked" ${DB.settings.isLocked?'checked':''} class="w-5 h-5 accent-nuha-primary">
                                    </div>

                                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl">
                                        <div>
                                            <span class="font-bold text-xs text-gray-900 block">Kunci Tombol Program & Donasi</span>
                                            <span class="text-[10px] text-gray-500">Mencegah pengunjung menekan tombol berdonasi</span>
                                        </div>
                                        <input type="checkbox" id="set-disable-donations" ${DB.settings.disableDonations?'checked':''} class="w-5 h-5 accent-nuha-primary">
                                    </div>

                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Pesan Pemeliharaan Website</label>
                                        <textarea id="set-lock-msg" rows="2" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">${DB.settings.lockMessage}</textarea>
                                    </div>
                                </div>

                                <button onclick="saveWebsiteSettings()" class="w-full py-3 bg-nuha-primary text-white font-bold text-xs rounded-xl hover:bg-nuha-dark transition shadow-md">Simpan Semua Pengaturan &rarr;</button>
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'heroSlides' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Tambah & Kelola Semua Foto Slide Hero</h3>
                            
                            <!-- FORM TAMBAH / EDIT SLIDE -->
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <h4 class="font-bold text-xs text-nuha-primary">Form Tambah Slide Banner</h4>

                                    <label class="text-xs font-bold text-gray-700">URL Foto Slide / File Upload</label>

                                </div>
                                <input type="text" id="new-slide-title" placeholder="Judul Teks Slide Hero..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="text" id="new-slide-sub" placeholder="Sub-Judul Teks Slide..." class="w-full p-3 border rounded-xl text-xs">
                                <button onclick="addHeroSlide()" class="w-full py-3 bg-nuha-primary hover:bg-nuha-dark text-white rounded-xl text-xs font-bold transition">Simpan Slide Banner Baru</button>
                            </div>

                            <!-- DISPLAY ALL SLIDES FOR EDITING & MANAGE -->
                            <div class="space-y-4 pt-4">
                                <h4 class="font-bold text-xs text-gray-800">Daftar Seluruh Slide Aktif (${(DB.heroSlides||[]).length} Foto Slide)</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${(DB.heroSlides||[]).map((slide, idx) => {
                                        const imgUrl = typeof slide === 'string' ? slide : slide.foto;
                                        const title = slide.judul || 'Tanpa Judul';
                                        const sub = slide.subjudul || '';
                                        return `
                                            <div class="p-4 border border-gray-200 rounded-2xl bg-white space-y-3 shadow-xs">
                                                <img src="${imgUrl}" class="w-full h-40 object-cover rounded-xl border">
                                                <div class="space-y-2">
                                                    <input type="text" id="slide-edit-title-${idx}" value="${title}" class="w-full p-2 border rounded-lg text-xs font-bold">
                                                    <input type="text" id="slide-edit-sub-${idx}" value="${sub}" class="w-full p-2 border rounded-lg text-xs text-gray-600">
                                                    <input type="text" id="slide-edit-foto-${idx}" value="${imgUrl}" class="w-full p-2 border rounded-lg text-xs font-mono">
                                                    <div class="flex gap-2 pt-1">
                                                        <button onclick="updateHeroSlide(${idx})" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold">Update Text/Foto</button>
                                                        <button onclick="removeHeroSlide(${idx})" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold">Hapus</button>
                                                    </div>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'pengurus' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola & Atur Level Hirarki Susunan Pengurus</h3>
                            
                            <!-- FORM TAMBAH PENGURUS -->
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <h4 class="font-bold text-xs text-nuha-primary">Tambah Jabatan Pengurus Baru</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input type="text" id="pengurus-nama" placeholder="Nama Lengkap & Gelar Pengurus..." class="p-3 border rounded-xl text-xs">
                                    <input type="text" id="pengurus-jabatan" placeholder="Jabatan (Contoh: Pengasuh/Ketua/Bendahara)..." class="p-3 border rounded-xl text-xs">
                                </div>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Level Hirarki Jabatan</label>
                                        <select id="pengurus-level" class="w-full mt-1 p-3 border rounded-xl text-xs font-bold bg-white">
                                            <option value="1">Level 1 - Pengasuh / Pembina Utama (Paling Tinggi)</option>
                                            <option value="2" selected>Level 2 - Pimpinan / Ketua Pengurus (Menengah)</option>
                                            <option value="3">Level 3 - Bendahara / Anggota / Staf (Bawah)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Foto Pengurus (Upload / Link URL)</label>
                                        <div class="flex gap-2 mt-1">
                                            <input type="text" id="pengurus-foto" placeholder="Paste URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                            <input type="file" id="p-file" onchange="uploadImageFile(this, 'pengurus-foto')" class="hidden">
                                            <button onclick="document.getElementById('p-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl hover:bg-gray-300">Upload</button>
                                        </div>
                                    </div>
                                </div>

                                <button onclick="addPengurus()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark transition">Simpan Pengurus Baru</button>

                            <!-- DAFTAR PENGURUS DENGAN EDITING FITUR -->
                            <div class="space-y-4 pt-4">
                                <h4 class="font-bold text-xs text-gray-800">Daftar Susunan Pengurus Aktif (Bisa Langsung Edit)</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    ${(DB.pengurusList||[]).map((p, idx) => `
                                        <div class="p-4 border border-gray-200 rounded-2xl bg-white space-y-3">
                                            <div class="space-y-2">
                                                <label class="text-[10px] font-bold text-gray-400">Nama</label>
                                                <input type="text" id="p-edit-nama-${idx}" value="${p.nama}" class="w-full p-2 border rounded-xl text-xs font-bold">
                                                <label class="text-[10px] font-bold text-gray-400">Jabatan</label>
                                                <input type="text" id="p-edit-jabatan-${idx}" value="${p.jabatan}" class="w-full p-2 border rounded-xl text-xs text-nuha-primary font-semibold">
                                                <label class="text-[10px] font-bold text-gray-400">Level Hirarki</label>
                                                <select id="p-edit-level-${idx}" class="w-full p-2 border rounded-xl text-xs font-bold bg-gray-50">
                                                    <option value="1" ${p.level===1?'selected':''}>Level 1 (Utama)</option>
                                                    <option value="2" ${p.level===2||!p.level?'selected':''}>Level 2 (Ketua)</option>
                                                    <option value="3" ${p.level===3?'selected':''}>Level 3 (Staf)</option>
                                                </select>
                                            </div>
                                            <div class="flex gap-2">
                                                <button onclick="updatePengurus(${idx})" class="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Simpan Update</button>
                                                <button onclick="removePengurus(${idx})" class="px-3 py-2 bg-red-600 text-white rounded-xl text-xs font-bold">Hapus</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'gallery' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Galeri Foto & Kegiatan</h3>
                            
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <h4 class="font-bold text-xs text-nuha-primary">Tambah Foto Galeri Baru</h4>
                                <input type="text" id="gal-judul" placeholder="Judul Foto Kegiatan..." class="w-full p-3 border rounded-xl text-xs">
                                <textarea id="gal-ket" placeholder="Keterangan Teks Singkat..." class="w-full p-3 border rounded-xl text-xs" rows="2"></textarea>
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto (Upload File / Link Foto)</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="gal-foto" placeholder="Paste Link Foto URL..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="gal-file" onchange="uploadImageFile(this, 'gal-foto')" class="hidden">
                                        <button onclick="document.getElementById('gal-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl hover:bg-gray-300">Upload</button>
                                    </div>
                                </div>
                                <button onclick="addGalleryItem()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark transition">Tambah ke Galeri</button>
                            </div>

                            <!-- DISPLAY GALERI DENGAN DOKUMEN FOTO BEBERAPA -->
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4">
                                ${(DB.gallery||[]).map((item, idx) => `
                                    <div class="p-4 border rounded-2xl bg-white space-y-2">
                                        <img src="${item.foto}" class="h-32 w-full object-cover rounded-xl">
                                        <h4 class="font-bold text-xs text-gray-900">${item.judul}</h4>
                                        <p class="text-[10px] text-gray-500">${item.ket || ''}</p>
                                        <button onclick="removeGallery(${idx})" class="w-full py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold">Hapus Foto</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'pembayaran' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Metode Pembayaran & QRIS</h3>
                            
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <h4 class="font-bold text-xs text-nuha-primary">Tambah Rekening / QRIS Baru</h4>
                                <input type="text" id="pay-name" placeholder="Nama Bank / QRIS (Contoh: Bank BSI / QRIS All Payment)..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="text" id="pay-account" placeholder="Nomor Rekening & Atas Nama..." class="w-full p-3 border rounded-xl text-xs">
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Gambar Kode QRIS (Jika Metode QRIS)</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="pay-qr" placeholder="Paste Link Foto QRIS..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="pay-file" onchange="uploadImageFile(this, 'pay-qr')" class="hidden">
                                        <button onclick="document.getElementById('pay-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl hover:bg-gray-300">Upload QR</button>
                                    </div>
                                </div>
                                <button onclick="addPaymentMethod()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark transition">Simpan Metode Pembayaran</button>
                            </div>

                            <div class="space-y-3 pt-2">
                                <h4 class="font-bold text-xs text-gray-800">Metode Pembayaran Aktif di Website</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${(DB.paymentMethods||[]).map((m, idx) => `
                                        <div class="p-4 border rounded-2xl bg-white space-y-2 flex flex-col justify-between">
                                            <div>
                                                <h4 class="font-bold text-xs text-gray-900">${m.name}</h4>
                                                <p class="text-xs text-nuha-primary font-semibold">${m.account}</p>
                                                ${m.qrImage ? `<img src="${m.qrImage}" class="h-24 w-24 object-contain mt-2 border p-1 rounded-lg">` : ''}
                                            </div>
                                            <button onclick="removePaymentMethod(${idx})" class="w-full py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold">Hapus Rekening</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'pengurus' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm">Tambah / Ubah Susunan Pengurus</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="pengurus-nama" placeholder="Nama Lengkap & Gelar Pengurus..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="text" id="pengurus-jabatan" placeholder="Jabatan (Contoh: Pengasuh Utama)..." class="w-full p-3 border rounded-xl text-xs">
                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Pengurus (Opsional)</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="pengurus-foto" placeholder="Paste URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="p-file" onchange="uploadImageFile(this, 'pengurus-foto')" class="hidden">
                                        <button onclick="document.getElementById('p-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload Foto</button>
                                    </div>
                                </div>
                                <button onclick="addPengurus()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold">Tambah Pengurus Baru</button>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4">
                                ${(DB.pengurusList||[]).map((p, idx) => `
                                    <div class="p-4 border rounded-2xl text-center space-y-2 bg-white">
                                        <h4 class="font-bold text-xs">${p.nama}</h4>
                                        <span class="text-[10px] text-emerald-700 font-semibold block">${p.jabatan}</span>
                                        <button onclick="removePengurus(${idx})" class="text-xs text-red-600 font-bold hover:underline">Hapus</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'program' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm">Kelola Program Unggulan</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="prog-judul" placeholder="Judul Program..." class="w-full p-3 border rounded-xl text-xs">
                                <input type="text" id="prog-kat" placeholder="Kategori (Pendidikan/Infrastruktur)..." class="w-full p-3 border rounded-xl text-xs">
                                <textarea id="prog-desc" placeholder="Deskripsi Singkat..." class="w-full p-3 border rounded-xl text-xs"></textarea>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="number" id="prog-target" placeholder="Target Dana (Rp)..." class="p-3 border rounded-xl text-xs">
                                    <input type="number" id="prog-terkumpul" placeholder="Terkumpul (Rp)..." class="p-3 border rounded-xl text-xs">
                                </div>
                                <div class="flex gap-2">
                                    <input type="text" id="prog-foto" placeholder="URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                    <input type="file" id="prog-file" onchange="uploadImageFile(this, 'prog-foto')" class="hidden">
                                    <button onclick="document.getElementById('prog-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload Foto</button>
                                </div>
                                <button onclick="addProgram()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold">Simpan Program</button>
                            </div>
                        </div>
                    ` : ''}

                    ${adminState.adminSubTab === 'berita' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm">Kelola Berita & Embed Media (TikTok/YT/IG/FB)</h3>
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <input type="text" id="news-judul" placeholder="Judul Berita..." class="w-full p-3 border rounded-xl text-xs">
                                <textarea id="news-ringkasan" placeholder="Ringkasan Berita..." class="w-full p-3 border rounded-xl text-xs"></textarea>
                                <input type="text" id="news-embed" placeholder="Link Media Embed (TikTok, YouTube, IG, FB)..." class="w-full p-3 border rounded-xl text-xs">
                                <div class="flex gap-2">
                                    <input type="text" id="news-foto" placeholder="URL Foto..." class="flex-1 p-3 border rounded-xl text-xs">
                                    <input type="file" id="news-file" onchange="uploadImageFile(this, 'news-foto')" class="hidden">
                                    <button onclick="document.getElementById('news-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl">Upload Foto</button>
                                </div>
                                <button onclick="addNews()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold">Simpan Berita</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            return container;
        }

        // HELPER READ FILE TO BASE64 DATA URL
        function uploadImageFile(inputEl, targetId) {
            if (inputEl.files && inputEl.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const target = document.getElementById(targetId);
                    if (target) target.value = e.target.result;
                };
                reader.readAsDataURL(inputEl.files[0]);
            }
        }

        function setAdminTab(tab) {
            adminState.adminSubTab = tab;
            renderAdminApp();
        }

        function saveWebsiteSettings() {
            DB.settings.siteName = document.getElementById('set-site-name')?.value || DB.settings.siteName;
            DB.settings.phone = document.getElementById('set-phone')?.value || DB.settings.phone;
            DB.settings.siteLogo = document.getElementById('set-logo-url')?.value || DB.settings.siteLogo;
            DB.settings.isLocked = document.getElementById('set-is-locked')?.checked || false;
            DB.settings.disableDonations = document.getElementById('set-disable-donations')?.checked || false;
            DB.settings.lockMessage = document.getElementById('set-lock-msg')?.value || DB.settings.lockMessage;
            
            DB.settings.socials = {
                whatsapp: document.getElementById('soc-wa')?.value || '',
                instagram: document.getElementById('soc-ig')?.value || '',
                youtube: document.getElementById('soc-yt')?.value || '',
                tiktok: document.getElementById('soc-tiktok')?.value || '',
                facebook: document.getElementById('soc-fb')?.value || ''
            };

            saveDB();
            alert('Pengaturan Website Berhasil Diperbarui!');
            renderAdminApp();
        }

        function addHeroSlide() {
            const url = document.getElementById('new-slide-url')?.value.trim();
            const title = document.getElementById('new-slide-title')?.value.trim();
            const sub = document.getElementById('new-slide-sub')?.value.trim();
            if (url) {
                if(!DB.heroSlides) DB.heroSlides = [];
                DB.heroSlides.push({ id: Date.now(), foto: url, judul: title, subjudul: sub });
                saveDB();
                alert('Foto Slide Hero berhasil ditambahkan!');
                renderAdminApp();
            }
        }

        function updateHeroSlide(idx) {
            const title = document.getElementById(`slide-edit-title-${idx}`)?.value;
            const sub = document.getElementById(`slide-edit-sub-${idx}`)?.value;
            const foto = document.getElementById(`slide-edit-foto-${idx}`)?.value;
            if (DB.heroSlides && DB.heroSlides[idx]) {
                DB.heroSlides[idx] = { id: Date.now(), foto: foto, judul: title, subjudul: sub };
                saveDB();
                alert('Slide Hero berhasil di-update!');
                renderAdminApp();
            }
        }

        function removeHeroSlide(index) {
            DB.heroSlides.splice(index, 1);
            saveDB();
            renderAdminApp();
        }

        function addPengurus() {
            const nama = document.getElementById('pengurus-nama')?.value.trim();
            const jabatan = document.getElementById('pengurus-jabatan')?.value.trim();
            const level = parseInt(document.getElementById('pengurus-level')?.value || 2);
            const foto = document.getElementById('pengurus-foto')?.value.trim();
            if (nama && jabatan) {
                if(!DB.pengurusList) DB.pengurusList = [];
                DB.pengurusList.push({ id: Date.now(), nama: nama, jabatan: jabatan, foto: foto, level: level });
                saveDB();
                renderAdminApp();
            }
        }

        function updatePengurus(idx) {
            const nama = document.getElementById(`p-edit-nama-${idx}`)?.value;
            const jabatan = document.getElementById(`p-edit-jabatan-${idx}`)?.value;
            const level = parseInt(document.getElementById(`p-edit-level-${idx}`)?.value || 2);
            if (DB.pengurusList && DB.pengurusList[idx]) {
                DB.pengurusList[idx].nama = nama;
                DB.pengurusList[idx].jabatan = jabatan;
                DB.pengurusList[idx].level = level;
                saveDB();
                alert('Pengurus berhasil diperbarui!');
                renderAdminApp();
            }
        }

        function removePengurus(idx) {
            DB.pengurusList.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addGalleryItem() {
            const judul = document.getElementById('gal-judul')?.value;
            const ket = document.getElementById('gal-ket')?.value;
            const foto = document.getElementById('gal-foto')?.value;

            if (judul && foto) {
                if(!DB.gallery) DB.gallery = [];
                DB.gallery.unshift({
                    id: Date.now(), judul, ket, foto, tanggal: new Date().toISOString().split('T')[0]
                });
                saveDB();
                alert('Foto galeri berhasil disimpan!');
                renderAdminApp();
            }
        }

        function removeGallery(idx) {
            DB.gallery.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addPaymentMethod() {
            const name = document.getElementById('pay-name')?.value;
            const account = document.getElementById('pay-account')?.value;
            const qrImage = document.getElementById('pay-qr')?.value;

            if (name && account) {
                if(!DB.paymentMethods) DB.paymentMethods = [];
                DB.paymentMethods.push({ id: Date.now(), name, account, qrImage, active: true });
                saveDB();
                alert('Metode Pembayaran Berhasil Ditambahkan!');
                renderAdminApp();
            }
        }

        function removePaymentMethod(idx) {
            DB.paymentMethods.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addPengurus() {
            const nama = document.getElementById('pengurus-nama')?.value.trim();
            const jabatan = document.getElementById('pengurus-jabatan')?.value.trim();
            const foto = document.getElementById('pengurus-foto')?.value.trim();
            if (nama && jabatan) {
                if(!DB.pengurusList) DB.pengurusList = [];
                DB.pengurusList.push({ id: Date.now(), nama: nama, jabatan: jabatan, foto: foto });
                saveDB();
                renderAdminApp();
            }
        }

        function removePengurus(idx) {
            DB.pengurusList.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addProgram() {
            const judul = document.getElementById('prog-judul')?.value;
            const kat = document.getElementById('prog-kat')?.value;
            const desc = document.getElementById('prog-desc')?.value;
            const target = parseFloat(document.getElementById('prog-target')?.value || 0);
            const terkumpul = parseFloat(document.getElementById('prog-terkumpul')?.value || 0);
            const foto = document.getElementById('prog-foto')?.value;

            if (judul) {
                DB.programs.unshift({
                    id: Date.now(), judul, kategori: kat, deskripsi: desc, target, terkumpul, foto
                });
                saveDB();
                alert('Program berhasil ditambahkan!');
                renderAdminApp();
            }
        }

        function addNews() {
            const judul = document.getElementById('news-judul')?.value;
            const ringkasan = document.getElementById('news-ringkasan')?.value;
            const embedUrl = document.getElementById('news-embed')?.value;
            const foto = document.getElementById('news-foto')?.value;

            if (judul) {
                DB.news.unshift({
                    id: Date.now(), judul, ringkasan, embedUrl, foto, tanggal: new Date().toISOString().split('T')[0]
                });
                saveDB();
                alert('Berita berhasil ditambahkan!');
                renderAdminApp();
            }
        }

        function logoutAdmin() {
            adminState.isLoggedIn = false;
            sessionStorage.removeItem('NUHA_ADMIN_AUTH');
            renderAdminApp();
        }

        window.onload = function() {
            renderAdminApp();
        }
    </script>
</body>
</html>
