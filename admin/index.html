<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINUHA Panel Admin</title>
    <link rel="icon" type="image/jpeg" href="https://www.upload.ee/image/19930797/Primary_Logo_1.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nuha: { primary: '#286B56', dark: '#144e36', gold: '#B99A62' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @keyframes shimmerSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,215,0,0.45) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shimmerSlide 2.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen">

    <div id="admin-root" class="w-full min-h-screen flex"></div>

    <script>
        const OFFICIAL_LOGO = "https://www.upload.ee/image/19930797/Primary_Logo_1.jpg";

        let DB = JSON.parse(localStorage.getItem('NUHA_DATABASE')) || {
            settings: {
                siteName: "Lembaga Infaq Nurul Hayah",
                siteLogo: OFFICIAL_LOGO,
                phone: "+6282333362299",
                isLocked: false,
                lockMessage: "Website sedang dalam pemeliharaan sistem. Silakan kembali beberapa saat lagi.",
                disableDonations: false,
                socials: {
                    whatsapp: "https://wa.me/6282333362299",
                    instagram: "https://www.instagram.com/lembagainfaqnurulhayah",
                    youtube: "https://youtube.com",
                    tiktok: "https://tiktok.com",
                    facebook: "https://facebook.com"
                },
                aboutText: "Lembaga Infaq NUHA hadir untuk berkhidmat dalam rangka membantu kesejahteraan dan kemandirian umat; mengangkat harkat sosial dengan mendayagunakan dana Zakat, Infak, Sedekah (ZIS), CSR, serta Dana Sosial Keagamaan Lainnya (DSKL) sesuai regulasi dan ketentuan syariah.",
                visiText: "Menjadi Lembaga Infaq terdepan dalam mewujudkan kesejahteraan sosial dan pendidikan yang merata, berkualitas, dan berkelanjutan bagi masyarakat kurang mampu.",
                misiText: "• Akses Pendidikan Layak bagi anak yatim & dhuafa\n• Pengembangan Fasilitas Sekolah & Asrama\n• Inovasi Keterampilan & Teknologi Santri\n• Pengelolaan Akuntabel & Transparan",
                welcomeMessage: "Assalamu'alaikum. Ada yang bisa dibantu?"
            },
            paymentMethods: [
                { id: 1, name: "Bank Syariah Indonesia (BSI)", account: "7123-4567-89 a.n NUHA", qrImage: "", active: true },
                { id: 2, name: "Bank Muamalat", account: "345-00123-99 a.n NUHA", qrImage: "", active: true },
                { id: 3, name: "QRIS All Payment Resmi NUHA", account: "Scan Barcode QRIS Sangat Mudah", qrImage: "https://placehold.co/400x400/286B56/FFFFFF?text=QRIS+NUHA", active: true }
            ],
            pengurusList: [
                { id: 1, nama: "Dr. KH. Ja'far Ath-Thayyar, Lc., M.A.", jabatan: "Pengasuh & Pembina Utama", foto: "", level: 1 },
                { id: 2, nama: "H. Ahmad Fauzi, M.Pd.", jabatan: "Ketua Pengurus Lembaga", foto: "", level: 2 },
                { id: 3, nama: "Siti Rahmah, S.E., Ak.", jabatan: "Bendahara & Keuangan", foto: "", level: 3 }
            ],
            stats: { totalInfaq: 248500000, totalDonatur: 1420 },
            heroSlides: [
                {
                    id: 1,
                    foto: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=1920&q=80",
                    judul: "Bekali Pendidikan, Kuatkan Masa Depan Santri!",
                    subjudul: "Mari raih keberkahan bersama Lembaga Infaq Nurul Hayah."
                },
                {
                    id: 2,
                    foto: "https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&w=1920&q=80",
                    judul: "Pembangunan Gedung Asrama Santri",
                    subjudul: "Fasilitas tempat tinggal yang layak, bersih, dan amanah bagi penghafal Al-Qur'an."
                }
            ],
            gallery: [
                { id: 1, judul: "Kajian Rutin Bersama Pengasuh", tanggal: "2026-10-20", foto: "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=800&q=80" }
            ],
            pendingConfirmations: [],
            blockedIPs: [],
            logs: [],
            programs: [
                {
                    id: 1,
                    judul: "Beasiswa Santri Yatim & Dhuafa NUHA",
                    kategori: "Pendidikan",
                    deskripsi: "Beasiswa penuh, tempat tinggal, dan konsumsi santri penghafal Qur'an.",
                    target: 150000000,
                    calcMode: "auto",
                    terkumpulManual: 112500000,
                    terkumpul: 112500000,
                    foto: "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80"
                }
            ],
            news: []
        };

        function saveDB() {
            localStorage.setItem('NUHA_DATABASE', JSON.stringify(DB));
        }

        let adminState = {
            adminSubTab: 'dashboard',
            isLoggedIn: sessionStorage.getItem('NUHA_ADMIN_AUTH') === 'true'
        };

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function renderAdminApp() {
            const root = document.getElementById('admin-root');
            root.innerHTML = '';

            if (!adminState.isLoggedIn) {
                root.appendChild(renderAdminLoginPage());
            } else {
                root.appendChild(renderAdminDashboard());
            }

            if (window.lucide) lucide.createIcons();
        }

        function renderAdminLoginPage() {
            const container = document.createElement('div');
            container.className = "w-full min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0f4e2b] via-[#146438] to-[#0a381e]";
            container.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl space-y-6">
                    <div class="text-center space-y-2">
                        <img src="${DB.settings.siteLogo || OFFICIAL_LOGO}" class="h-14 mx-auto object-contain bg-emerald-50 p-1.5 rounded-2xl">
                        <h2 class="text-xl font-bold font-poppins text-gray-900">${DB.settings.siteName || 'Lembaga Infaq Nurul Hayah'}</h2>
                        <p class="text-xs text-gray-500 font-medium">Manage Website Infaq</p>
                    </div>

                    <form onsubmit="event.preventDefault(); processAdminLogin();" class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-gray-700">Kode Akses / Kata Sandi Admin</label>
                            <input type="password" id="admin-pass" placeholder="Masukkan password admin..." class="w-full mt-1 p-3.5 border border-gray-200 rounded-2xl text-xs focus:ring-2 focus:ring-nuha-primary focus:outline-none" required>
                        </div>
                        <button type="submit" class="btn-shimmer w-full py-3.5 bg-[#146438] hover:bg-[#0f4e2b] text-white font-bold text-sm rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
                            <span>Masuk</span> &rarr;
                        </button>
                    </form>
                </div>
            `;
            return container;
        }

        function processAdminLogin() {
            const pass = document.getElementById('admin-pass')?.value;
            if (pass === 'infaqnuha2025' || pass === 'adminnuha') {
                adminState.isLoggedIn = true;
                sessionStorage.setItem('NUHA_ADMIN_AUTH', 'true');
                renderAdminApp();
            } else {
                alert('Sandi Admin Salah! Gunakan: infaqnuha2025');
            }
        }

        function renderAdminDashboard() {
            const container = document.createElement('div');
            container.className = "flex w-full min-h-screen";

            const pendingCount = (DB.pendingConfirmations || []).filter(c => c.status && c.status.includes('Menunggu')).length;

            container.innerHTML = `
                <!-- Sidebar -->
                <div class="w-64 bg-nuha-dark text-white p-6 space-y-8 flex flex-col justify-between shrink-0">
                    <div class="space-y-6">
                        <div class="bg-white/10 p-3 rounded-2xl flex items-center gap-3">
                            <img src="${DB.settings.siteLogo || OFFICIAL_LOGO}" class="h-8 w-8 bg-white p-1 rounded-xl object-contain">
                            <span class="font-bold text-xs line-clamp-1">${DB.settings.siteName}</span>
                        </div>
                        <nav class="space-y-1 text-xs font-semibold">
                            <button onclick="setAdminTab('dashboard')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='dashboard'?'bg-white/20':''}">Dashboard & Stat</button>
                            <button onclick="setAdminTab('verifikasi')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='verifikasi'?'bg-white/20':''} flex justify-between items-center">
                                <span>Verifikasi Donasi</span>
                                ${pendingCount > 0 ? `<span class="px-2 py-0.5 bg-amber-500 text-white text-[10px] rounded-full font-bold">${pendingCount}</span>` : ''}
                            </button>
                            <button onclick="setAdminTab('logs')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='logs'?'bg-white/20':''}">Log Aktivitas & IP</button>
                            <button onclick="setAdminTab('settings')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='settings'?'bg-white/20':''}">Pengaturan Web & Lock</button>
                            <button onclick="setAdminTab('heroSlides')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='heroSlides'?'bg-white/20':''}">Hero Slide & Teks</button>
                            <button onclick="setAdminTab('pengurus')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='pengurus'?'bg-white/20':''}">Susunan Pengurus</button>
                            <button onclick="setAdminTab('program')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='program'?'bg-white/20':''}">Program & Dana Terkumpul</button>
                            <button onclick="setAdminTab('gallery')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='gallery'?'bg-white/20':''}">Kelola Galeri Foto</button>
                            <button onclick="setAdminTab('berita')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='berita'?'bg-white/20':''}">Berita & Embed Media</button>
                            <button onclick="setAdminTab('pembayaran')" class="w-full text-left p-3 rounded-xl hover:bg-white/10 ${adminState.adminSubTab==='pembayaran'?'bg-white/20':''}">Metode Pembayaran</button>
                        </nav>
                    </div>
                    <button onclick="logoutAdmin()" class="w-full p-3 bg-red-600/80 hover:bg-red-600 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2">Keluar Admin</button>
                </div>

                <!-- Main Content Area -->
                <div class="flex-1 p-8 space-y-6 overflow-y-auto max-h-screen bg-gray-50">
                    <div class="flex justify-between items-center border-b pb-4">
                        <h1 class="text-2xl font-bold text-gray-900 capitalize">CMS Admin - ${adminState.adminSubTab}</h1>
                        <a href="index.html" target="_blank" class="text-xs bg-emerald-100 text-nuha-primary px-3 py-1.5 rounded-xl font-bold hover:bg-emerald-200">Lihat Live Website &rarr;</a>
                    </div>

                    ${renderAdminSubTabContent()}
                </div>
            `;
            return container;
        }

        function renderAdminSubTabContent() {
            switch(adminState.adminSubTab) {
                case 'dashboard':
                    return `
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                            <div class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm">
                                <span class="text-xs text-gray-400">Total Donasi Terkumpul</span>
                                <h3 class="text-2xl font-bold text-nuha-primary mt-1">${formatRupiah(DB.stats.totalInfaq)}</h3>
                            </div>
                            <div class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm">
                                <span class="text-xs text-gray-400">Total Donatur</span>
                                <h3 class="text-2xl font-bold text-gray-900 mt-1">${DB.stats.totalDonatur} Orang</h3>
                            </div>
                            <div class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm">
                                <span class="text-xs text-gray-400">Status Akses Website</span>
                                <h3 class="text-lg font-bold ${DB.settings.isLocked?'text-red-600':'text-emerald-600'} mt-1">${DB.settings.isLocked ? 'Terkunci (Maintenance)' : 'Aktif Publik'}</h3>
                            </div>
                        </div>
                    `;
                
                case 'settings':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6 max-w-3xl">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Pengaturan Identitas & Konten Website</h3>
                            
                            <div class="space-y-4">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Nama Website</label>
                                        <input type="text" id="set-site-name" value="${DB.settings.siteName || ''}" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Nomor Telepon / WA</label>
                                        <input type="text" id="set-phone" value="${DB.settings.phone || ''}" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-gray-700">URL Logo Website</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="set-logo-url" value="${DB.settings.siteLogo || ''}" class="flex-1 p-3 border border-gray-200 rounded-xl text-xs">
                                        <input type="file" id="logo-file-input" onchange="uploadImageFile(this, 'set-logo-url')" class="hidden">
                                        <button onclick="document.getElementById('logo-file-input').click()" class="px-4 py-2 bg-gray-100 border text-xs font-bold rounded-xl hover:bg-gray-200">Upload</button>
                                    </div>
                                </div>

                                <div class="pt-4 border-t space-y-3">
                                    <h4 class="font-bold text-xs text-nuha-primary">Edit Teks Profil (Tentang, Visi & Misi)</h4>
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Teks "Tentang LINUHA"</label>
                                        <textarea id="set-about-text" rows="3" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">${DB.settings.aboutText || ''}</textarea>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label class="text-xs font-bold text-gray-700">Teks Visi Kami</label>
                                            <textarea id="set-visi-text" rows="3" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">${DB.settings.visiText || ''}</textarea>
                                        </div>
                                        <div>
                                            <label class="text-xs font-bold text-gray-700">Teks Misi & Fokus</label>
                                            <textarea id="set-misi-text" rows="3" class="w-full mt-1 p-3 border border-gray-200 rounded-xl text-xs">${DB.settings.misiText || ''}</textarea>
                                        </div>
                                    </div>
                                </div>

                                <button onclick="updateSettings()" class="w-full py-3 bg-nuha-primary text-white font-bold text-xs rounded-xl hover:bg-nuha-dark">Simpan Perubahan Settings</button>

                                <div class="pt-6 border-t space-y-4">
                                    <h4 class="font-bold text-xs text-red-700">Kontrol Kunci / Maintenance Website</h4>
                                    <div class="flex gap-3">
                                        <button onclick="toggleWebsiteLock(true)" class="flex-1 py-3 bg-red-600 text-white font-bold text-xs rounded-xl hover:bg-red-700">Kunci Website (Maintenance)</button>
                                        <button onclick="toggleWebsiteLock(false)" class="flex-1 py-3 bg-emerald-600 text-white font-bold text-xs rounded-xl hover:bg-emerald-700">Buka Akses Website</button>
                                    </div>
                                    <div class="flex gap-3">
                                        <button onclick="toggleDonationsLock(true)" class="flex-1 py-3 bg-amber-600 text-white font-bold text-xs rounded-xl hover:bg-amber-700">Kunci Semua Tombol Donasi</button>
                                        <button onclick="toggleDonationsLock(false)" class="flex-1 py-3 bg-blue-600 text-white font-bold text-xs rounded-xl hover:bg-blue-700">Buka Tombol Donasi</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                case 'program':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola Program & Dana Terkumpul (Auto / Manual)</h3>
                            
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <h4 class="font-bold text-xs text-nuha-primary">Form Tambah Program Baru</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input type="text" id="prog-judul" placeholder="Judul Program..." class="p-3 border rounded-xl text-xs">
                                    <input type="text" id="prog-kategori" placeholder="Kategori (Contoh: Pendidikan)..." class="p-3 border rounded-xl text-xs">
                                </div>
                                <textarea id="prog-deskripsi" rows="2" placeholder="Deskripsi Singkat Program..." class="w-full p-3 border rounded-xl text-xs"></textarea>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-600 block">Target Dana (Rp)</label>
                                        <input type="number" id="prog-target" placeholder="Contoh: 100000000" class="w-full p-3 border rounded-xl text-xs">
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-600 block">Mode Perhitungan</label>
                                        <select id="prog-calc-mode" class="w-full p-3 border rounded-xl text-xs font-bold bg-white">
                                            <option value="auto">Otomatis (Dari Transaksi)</option>
                                            <option value="manual">Manual (Nominal Custom)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-600 block">Nominal Terkumpul Manual (Rp)</label>
                                        <input type="number" id="prog-terkumpul-manual" placeholder="Jika mode manual..." class="w-full p-3 border rounded-xl text-xs">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-gray-700">Foto Program</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="text" id="prog-foto" placeholder="Paste Link Foto URL..." class="flex-1 p-3 border rounded-xl text-xs">
                                        <input type="file" id="prog-file" onchange="uploadImageFile(this, 'prog-foto')" class="hidden">
                                        <button onclick="document.getElementById('prog-file').click()" class="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl hover:bg-gray-300">Upload</button>
                                    </div>
                                </div>

                                <button onclick="addProgram()" class="w-full py-3 bg-nuha-primary text-white rounded-xl text-xs font-bold hover:bg-nuha-dark">Simpan Program Baru</button>
                            </div>

                            <div class="space-y-4 pt-4">
                                <h4 class="font-bold text-xs text-gray-800">Daftar Program & Kontrol Perhitungan Dana</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${(DB.programs||[]).map((prog, idx) => `
                                        <div class="p-4 border border-gray-200 rounded-2xl bg-white space-y-3 shadow-xs">
                                            <img src="${prog.foto}" class="w-full h-32 object-cover rounded-xl border">
                                            <div class="space-y-2">
                                                <input type="text" id="prog-edit-judul-${idx}" value="${prog.judul}" class="w-full p-2 border rounded-lg text-xs font-bold">
                                                
                                                <div class="grid grid-cols-2 gap-2">
                                                    <div>
                                                        <label class="text-[10px] text-gray-500 font-bold block">Target (Rp)</label>
                                                        <input type="number" id="prog-edit-target-${idx}" value="${prog.target}" class="w-full p-2 border rounded-lg text-xs font-bold">
                                                    </div>
                                                    <div>
                                                        <label class="text-[10px] text-gray-500 font-bold block">Mode Perhitungan</label>
                                                        <select id="prog-edit-mode-${idx}" class="w-full p-2 border rounded-lg text-xs font-bold bg-gray-50">
                                                            <option value="auto" ${prog.calcMode==='auto'||!prog.calcMode?'selected':''}>Otomatis</option>
                                                            <option value="manual" ${prog.calcMode==='manual'?'selected':''}>Manual</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label class="text-[10px] text-gray-500 font-bold block">Dana Terkumpul Manual (Rp)</label>
                                                    <input type="number" id="prog-edit-manual-${idx}" value="${prog.terkumpulManual || prog.terkumpul || 0}" class="w-full p-2 border rounded-lg text-xs text-emerald-700 font-bold">
                                                </div>

                                                <div class="flex gap-2 pt-1">
                                                    <button onclick="updateProgram(${idx})" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold">Update Program</button>
                                                    <button onclick="removeProgram(${idx})" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold">Hapus</button>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;

                case 'pengurus':
                    return `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm text-gray-900 border-b pb-3">Kelola & Atur Level Hirarki Susunan Pengurus</h3>
                            
                            <div class="space-y-3 p-4 bg-gray-50 rounded-2xl">
                                <h4 class="font-bold text-xs text-nuha-primary">Tambah Jabatan Pengurus Baru</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input type="text" id="pengurus-nama" placeholder="Nama Lengkap & Gelar..." class="p-3 border rounded-xl text-xs">
                                    <input type="text" id="pengurus-jabatan" placeholder="Jabatan (Contoh: Pengasuh/Ketua)..." class="p-3 border rounded-xl text-xs">
                                </div>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-bold text-gray-700">Level Hirarki Jabatan</label>

        // MANAGEMENT FUNCTIONS
        function setAdminTab(tab) {
            adminState.adminSubTab = tab;

        function logoutAdmin() {
            sessionStorage.removeItem('NUHA_ADMIN_AUTH');
            adminState.isLoggedIn = false;
            renderAdminApp();

        function uploadImageFile(fileInput, targetId) {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const target = document.getElementById(targetId);
                    if (target) target.value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function updateSettings() {
            DB.settings.siteName = document.getElementById('set-site-name')?.value || DB.settings.siteName;

            DB.settings.siteLogo = document.getElementById('set-logo-url')?.value || DB.settings.siteLogo;
            DB.settings.aboutText = document.getElementById('set-about-text')?.value || DB.settings.aboutText;
            DB.settings.visiText = document.getElementById('set-visi-text')?.value || DB.settings.visiText;
            DB.settings.misiText = document.getElementById('set-misi-text')?.value || DB.settings.misiText;
            saveDB();
            alert('Pengaturan Website Berhasil Diperbarui!');
            renderAdminApp();
        }

        function toggleWebsiteLock(lock) {
            DB.settings.isLocked = lock;
            saveDB();
            alert(lock ? 'Website Dikunci (Mode Pemeliharaan)!' : 'Akses Website Dibuka kembali!');
            renderAdminApp();
        }

        function toggleDonationsLock(lock) {
            DB.settings.disableDonations = lock;
            saveDB();
            alert(lock ? 'Semua Tombol Donasi Dikunci!' : 'Tombol Donasi Dibuka!');
            renderAdminApp();
        }

        function approveDonation(idx) {
            if (DB.pendingConfirmations && DB.pendingConfirmations[idx]) {
                DB.pendingConfirmations[idx].status = 'Berhasil Terverifikasi';
                saveDB();
                alert('Donasi telah disetujui!');
                renderAdminApp();
            }
        }

            if (DB.pendingConfirmations && DB.pendingConfirmations[idx]) {
                DB.pendingConfirmations[idx].status = 'Ditolak';
                saveDB();
                alert('Donasi ditolak.');
                renderAdminApp();
            }
        }

        function blockIP() {
            const ip = document.getElementById('ip-to-block')?.value.trim();
            if (ip) {
                if (!DB.blockedIPs) DB.blockedIPs = [];
                if (!DB.blockedIPs.includes(ip)) DB.blockedIPs.push(ip);
                saveDB();
                alert(`IP ${ip} Diblokir!`);
                renderAdminApp();
            }
        }

        function blockSpecificIP(ip) {
            if (ip) {
                if (!DB.blockedIPs) DB.blockedIPs = [];
                if (!DB.blockedIPs.includes(ip)) DB.blockedIPs.push(ip);
                saveDB();
                alert(`IP ${ip} Diblokir!`);
                renderAdminApp();
            }
        }

        function unblockIP(idx) {
            if (DB.blockedIPs) {
                DB.blockedIPs.splice(idx, 1);
                saveDB();
                renderAdminApp();
            }
        }

        function clearLogs() {
            DB.logs = [];
            saveDB();
            renderAdminApp();
        }

        function addProgram() {
            const judul = document.getElementById('prog-judul')?.value;
            const kat = document.getElementById('prog-kategori')?.value || 'Umum';
            const desc = document.getElementById('prog-deskripsi')?.value;
            const target = parseFloat(document.getElementById('prog-target')?.value || 0);
            const mode = document.getElementById('prog-calc-mode')?.value || 'auto';
            const manual = parseFloat(document.getElementById('prog-terkumpul-manual')?.value || 0);
            const foto = document.getElementById('prog-foto')?.value || 'https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80';

            if (judul) {
                DB.programs.push({
                    id: Date.now(),
                    judul: judul,
                    kategori: kat,
                    deskripsi: desc,
                    target: target,
                    calcMode: mode,
                    terkumpulManual: manual,
                    terkumpul: manual,
                    foto: foto
                });
                saveDB();
                alert('Program Ditambahkan!');
                renderAdminApp();
            }
        }

        function updateProgram(idx) {
            if (DB.programs && DB.programs[idx]) {
                const j = document.getElementById(`prog-edit-judul-${idx}`)?.value;
                const t = parseFloat(document.getElementById(`prog-edit-target-${idx}`)?.value || 0);
                const m = document.getElementById(`prog-edit-mode-${idx}`)?.value;
                const val = parseFloat(document.getElementById(`prog-edit-manual-${idx}`)?.value || 0);

                if (j) DB.programs[idx].judul = j;
                if (t) DB.programs[idx].target = t;
                if (m) DB.programs[idx].calcMode = m;
                DB.programs[idx].terkumpulManual = val;
                DB.programs[idx].terkumpul = val;
                saveDB();
                alert('Program Diperbarui!');
                renderAdminApp();
            }

            const foto = document.getElementById('gal-foto')?.value;

            if (judul && foto) {
                DB.gallery.unshift({ id: Date.now(), judul: judul, tanggal: tanggal, foto: foto });
                saveDB();
                alert('Foto Galeri Ditambahkan!');
                renderAdminApp();
            }
        }

        function removeGalleryItem(idx) {
            DB.gallery.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addNewsItem() {
            const judul = document.getElementById('news-judul')?.value;
            const ringkasan = document.getElementById('news-ringkasan')?.value;
            const embed = document.getElementById('news-embed')?.value;
            const foto = document.getElementById('news-foto')?.value || 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80';

            if (judul) {
                DB.news.unshift({
                    id: Date.now(),
                    judul: judul,
                    ringkasan: ringkasan,
                    embedUrl: embed,
                    foto: foto,
                    tanggal: new Date().toISOString().split('T')[0]
                });
                saveDB();
                alert('Berita Diterbitkan!');
                renderAdminApp();
            }
        }

        function removeNewsItem(idx) {
            DB.news.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addPaymentMethod() {
            const name = document.getElementById('pay-name')?.value;
            const acc = document.getElementById('pay-account')?.value;
            const qr = document.getElementById('pay-qr')?.value;

            if (name && acc) {
                DB.paymentMethods.push({ id: Date.now(), name: name, account: acc, qrImage: qr, active: true });
                saveDB();
                alert('Metode Pembayaran Ditambahkan!');
                renderAdminApp();
            }
        }

        function removePaymentMethod(idx) {
            DB.paymentMethods.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        function addHeroSlide() {
            const judul = document.getElementById('slide-judul')?.value;
            const sub = document.getElementById('slide-subjudul')?.value;
            const foto = document.getElementById('slide-foto')?.value;

            if (judul && foto) {
                DB.heroSlides.push({ id: Date.now(), judul: judul, subjudul: sub, foto: foto });
                saveDB();
                alert('Hero Slide Ditambahkan!');
                renderAdminApp();
            }
        }

        function removeHeroSlide(idx) {
            DB.heroSlides.splice(idx, 1);
            saveDB();
            renderAdminApp();
        }

        window.onload = function() {
            renderAdminApp();
        };
    </script>
</body>
</html>
