<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembaga Infaq Nurul Hayah</title>
  
  <!-- Favicon / Web Icon Resmi -->
  <link rel="icon" type="image/jpeg" href="https://www.upload.ee/image/19709356/Primary_Logo_1.jpg.jpeg">
  <link rel="shortcut icon" type="image/jpeg" href="https://www.upload.ee/image/19709356/Primary_Logo_1.jpg.jpeg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Inter CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase Auth Module untuk Google OAuth Sign-In Resmi -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDemoKeyForGoogleAuthInfaqNuha",
          authDomain: "infaq-nurul-hayah.firebaseapp.com",
          projectId: "infaq-nurul-hayah",
        };

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      window.firebaseAuth = auth;
      window.GoogleAuthProvider = GoogleAuthProvider;
      window.signInWithPopup = signInWithPopup;
    } catch (e) {
      console.log("Firebase Auth init:", e);
    }
  </script>

  <!-- React 18 & ReactDOM 18 & Babel Standalone via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-800 antialiased selection:bg-[#1F5946] selection:text-white">

  <!-- React Mounting Container -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_SETTINGS = {
      orgName: "Lembaga Infaq Nurul Hayah",
      tagline: "Amanah Bersama, Sejahtera dan Berdaya",
      subTagline: "Berbagi Kebaikan, Menebar Kebermanfaatan",
      description: "Lembaga filantropi Islam terpercaya yang berfokus pada penghimpunan dan penyaluran dana infaq secara amanah, transparan, dan profesional demi kesejahteraan serta kemandirian umat.",
      address: "Jl. Lingkar Provinsi No.07, Sawah, Bulakelor, Ketanggungan, Brebes Regency",
      whatsapp: "+62 823-3336-2299",
      email: "infaqnuha@gmail.com",
      tiktok: "Lembaga Infaq Nurul Hayah",
      instagram: "Lembaga Infaq Nurul Hayah",
      facebook: "Lembaga Infaq Nurul Hayah",
      logoUrl: "https://www.upload.ee/image/19709356/Primary_Logo_1.jpg.jpeg"
    };

    const INITIAL_PROGRAMS = [];
    const INITIAL_DONATIONS = [];
    const INITIAL_GALLERY = [];

    const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
    const formatNumber = (num) => new Intl.NumberFormat('id-ID').format(num || 0);

    function NurulHayahLogo({ size = "default", className = "" }) {
      const isSmall = size === "small";
      const isLarge = size === "large";
      const imgSize = isSmall ? "w-9 h-9" : isLarge ? "w-14 h-14" : "w-11 h-11";

      return (
        <div className={`flex items-center space-x-3.5 select-none ${className}`}>
          <img 
            src={INITIAL_SETTINGS.logoUrl} 
            alt="Lembaga Infaq Nurul Hayah" 
            className={`${imgSize} object-contain rounded-lg flex-shrink-0 shadow-sm`}
            onError={(e) => {
              e.target.onerror = null;
              e.target.src = "https://placehold.co/100x100/1F5946/FFFFFF?text=NH";
            }}
          />
          <div className="flex flex-col justify-center text-left">
            <span className="text-[10px] sm:text-[11px] font-bold tracking-[0.22em] text-[#1F5946] uppercase leading-none mb-0.5">
              LEMBAGA INFAQ
            </span>
            <span className="text-base sm:text-xl font-black text-[#1F5946] tracking-tight leading-tight">
              Nurul Hayah
            </span>
            {!isSmall && (
              <span className="text-[9px] sm:text-[10px] font-medium text-[#B89355] tracking-wide leading-none mt-0.5">
                Amanah Bersama, Sejahtera dan Berdaya
              </span>
            )}
          </div>
        </div>
      );
    }

    const Icons = {
      Heart: () => <svg className="w-5 h-5 inline-block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
      Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>,
      ArrowRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>,
      Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>,
      X: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>,
      Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>,
      WhatsApp: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>,
      Layers: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>,
      Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      LogOut: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>,
      MapPin: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Phone: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>,
      Mail: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>,
      CheckCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    };

    function App() {
      const [settings, setSettings] = useState(INITIAL_SETTINGS);
      const [programs, setPrograms] = useState(INITIAL_PROGRAMS);
      const [donations, setDonations] = useState(INITIAL_DONATIONS);
      const [gallery, setGallery] = useState(INITIAL_GALLERY);
      const [adminLogs, setAdminLogs] = useState([
        { id: "LOG-1", action: "Sistem inisialisasi berhasil", time: "2026-08-31 08:00", ip: "127.0.0.1" }
      ]);

      const [currentRoute, setCurrentRoute] = useState('home');
      const [selectedProgram, setSelectedProgram] = useState(null);
      const [infaqSuccessData, setInfaqSuccessData] = useState(null);

      const [currentUser, setCurrentUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'

      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminUser, setAdminUser] = useState(null);
      const [adminLoginInput, setAdminLoginInput] = useState({ username: '', password: '' });
      const [adminLoginError, setAdminLoginError] = useState('');
      const [adminTab, setAdminTab] = useState('dashboard');

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState("Semua");
      const [galleryCategory, setGalleryCategory] = useState("Semua");
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        const handleLocation = () => {
          const hash = window.location.hash;
          const pathname = window.location.pathname;

          if (hash === '#INFAQNUHA' || pathname === '/INFAQNUHA') {
            if (isAdminAuthenticated) {
              setCurrentRoute('admin-dashboard');
            } else {
              setCurrentRoute('admin-login');
            }
          }
        };

        handleLocation();
        window.addEventListener('hashchange', handleLocation);
        window.addEventListener('popstate', handleLocation);
        return () => {
          window.removeEventListener('hashchange', handleLocation);
          window.removeEventListener('popstate', handleLocation);
        };
      }, [isAdminAuthenticated]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleUserLogin = (userData) => {
        setCurrentUser(userData);
        setAuthModalOpen(false);
        showToast(`Selamat datang kembali, ${userData.name}!`);
      };

      const handleUserLogout = () => {
        setCurrentUser(null);
        showToast("Anda telah keluar akun.");
      };

      const stats = useMemo(() => {
        const totalCollected = donations
          .filter(d => d.status === 'Terverifikasi')
          .reduce((sum, d) => sum + d.amount, 0);
        const activeProgramsCount = programs.filter(p => p.status === 'Aktif').length;
        const totalBeneficiaries = programs.reduce((sum, p) => sum + p.beneficiaries, 0);
        const totalDonors = new Set(donations.map(d => d.donorName)).size;
        const totalDisbursed = 0;

        return {
          totalCollected,
          activeProgramsCount,
          totalPrograms: programs.length,
          totalBeneficiaries,
          totalDonors,
          totalDisbursed
        };
      }, [programs, donations]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        setAdminLoginError('');

        if (adminLoginInput.username === 'INFAQNUHA' && adminLoginInput.password === '@Infaqnurulhayah79') {
          setIsAdminAuthenticated(true);
          setAdminUser({ username: 'INFAQNUHA', role: 'Super Administrator' });
          setCurrentRoute('admin-dashboard');
          setAdminLogs(prev => [{
            id: `LOG-${Date.now()}`,
            action: `Login berhasil oleh INFAQNUHA`,
            time: new Date().toLocaleString('id-ID'),
            ip: "Secure-Client-Auth"
          }, ...prev]);
          showToast("Selamat Datang di Panel Manajemen Lembaga Infaq Nurul Hayah");
        } else {
          setAdminLoginError("Username atau Password administrator salah.");
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        setAdminUser(null);
        setCurrentRoute('home');
        window.location.hash = '';
        showToast("Sesi Admin telah berakhir.");
      };

      const handlePublicInfaqSubmit = (formData) => {
        const newTrx = {
          id: `TRX-${Math.floor(1000 + Math.random() * 9000)}`,
          donorName: formData.isAnon ? "Hamba Allah" : (formData.name || "Hamba Allah"),
          amount: Number(formData.amount),
          programTitle: formData.programTitle,
          paymentMethod: formData.paymentMethod,
          status: "Pending",
          date: new Date().toLocaleString('id-ID'),
          notes: formData.notes || ""
        };

        setDonations([newTrx, ...donations]);
        setInfaqSuccessData({ ...newTrx, actualName: formData.name });
        showToast("Permohonan infaq berhasil dibuat!");
      };

      return (
        <div className="min-h-screen bg-white text-slate-800 font-sans antialiased flex flex-col">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-[9999] bg-[#1F5946] text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm border border-[#B89355]/40 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-[#B89355]"></span>
              <span className="font-medium">{toastMessage}</span>
            </div>
          )}

          {currentRoute === 'admin-login' ? (
            <AdminLoginView 
              loginInput={adminLoginInput}
              setLoginInput={setAdminLoginInput}
              onSubmit={handleAdminLogin}
              error={adminLoginError}
              onBackToHome={() => { setCurrentRoute('home'); window.location.hash = ''; }}
            />
          ) : currentRoute === 'admin-dashboard' && isAdminAuthenticated ? (
            <AdminDashboardView 
              adminTab={adminTab}
              setAdminTab={setAdminTab}
              adminUser={adminUser}
              onLogout={handleAdminLogout}
              stats={stats}
              programs={programs}
              setPrograms={setPrograms}
              donations={donations}
              setDonations={setDonations}
              gallery={gallery}
              setGallery={setGallery}
              settings={settings}
              setSettings={setSettings}
              adminLogs={adminLogs}
              showToast={showToast}
            />
          ) : (
            <>
              <PublicNavbar 
                mobileMenuOpen={mobileMenuOpen}
                setMobileMenuOpen={setMobileMenuOpen}
                setCurrentRoute={setCurrentRoute}
                currentUser={currentUser}
                onOpenAuth={(mode) => { setAuthMode(mode || 'login'); setAuthModalOpen(true); }}
                onLogout={handleUserLogout}
              />

              <main className="flex-grow bg-white">
                {currentRoute === 'home' && (
                  <>
                    <HeroSection 
                      onOpenInfaq={() => { setSelectedProgram(null); setCurrentRoute('infaq'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                    />
                    <ProgramsSection 
                      programs={programs}
                      selectedCategory={selectedCategory}
                      setSelectedCategory={setSelectedCategory}
                      onSelectProgram={(prog) => { setSelectedProgram(prog); setCurrentRoute('program-detail'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                      onInfaqNow={(prog) => { setSelectedProgram(prog); setCurrentRoute('infaq'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                    />
                    <GallerySection gallery={gallery} galleryCategory={galleryCategory} setGalleryCategory={setGalleryCategory} />
                    <ContactSection settings={settings} />
                  </>
                )}

                {currentRoute === 'program-detail' && selectedProgram && (
                  <ProgramDetailView 
                    program={selectedProgram}
                    onBack={() => { setCurrentRoute('home'); setSelectedProgram(null); }}
                    onInfaqNow={() => { setCurrentRoute('infaq'); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                    recentDonations={donations.filter(d => d.programTitle === selectedProgram.title && d.status === 'Terverifikasi')}
                  />
                )}

                {currentRoute === 'infaq' && (
                  <InfaqFormView 
                    programs={programs}
                    selectedProgram={selectedProgram}
                    settings={settings}
                    onSubmitInfaq={handlePublicInfaqSubmit}
                    successData={infaqSuccessData}
                    onReset={() => setInfaqSuccessData(null)}
                    onBack={() => { setCurrentRoute('home'); setInfaqSuccessData(null); }}
                  />
                )}
              </main>

              <PublicFooter settings={settings} />

              {}
              {authModalOpen && (
                <AuthModal 
                  mode={authMode}
                  setMode={setAuthMode}
                  onClose={() => setAuthModalOpen(false)}
                  onLoginSuccess={handleUserLogin}
                  showToast={showToast}
                />
              )}
            </>
          )}
        </div>
      );
    }

    function PublicNavbar({ mobileMenuOpen, setMobileMenuOpen, setCurrentRoute, currentUser, onOpenAuth, onLogout }) {
      const [isScrolled, setIsScrolled] = useState(false);
      const [userDropdownOpen, setUserDropdownOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { label: "Beranda", href: "#beranda" },
        { label: "Program Infaq", href: "#program" },
        { label: "Galeri Dokumentasi", href: "#galeri" },
        { label: "Kontak Layanan", href: "#kontak" }
      ];

      return (
        <nav className={`sticky top-0 z-50 transition-all duration-300 ${
          isScrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-3 border-b border-slate-100' : 'bg-white py-4 border-b border-slate-100/70'
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <button 
              onClick={() => { setCurrentRoute('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              className="focus:outline-none"
            >
              <NurulHayahLogo />
            </button>

            <div className="hidden lg:flex items-center space-x-7 font-medium text-sm text-slate-700">
              {navLinks.map((link, idx) => (
                <a
                  key={idx}
                  href={link.href}
                  onClick={() => setCurrentRoute('home')}
                  className="hover:text-[#1F5946] transition-colors py-1 relative group font-semibold"
                >
                  {link.label}
                  <span className="absolute bottom-0 left-0 w-0 h-0.5 bg-[#B89355] transition-all duration-300 group-hover:w-full"></span>
                </a>
              ))}
            </div>

            {}
            <div className="hidden sm:flex items-center space-x-3">
              {currentUser ? (
                <div className="relative">
                  <button
                    onClick={() => setUserDropdownOpen(!userDropdownOpen)}
                    className="flex items-center space-x-2.5 py-1.5 px-3 rounded-full bg-slate-50 border border-slate-200 hover:bg-slate-100 transition focus:outline-none"
                  >
                    <img 
                      src={currentUser.avatar} 
                      alt={currentUser.name} 
                      className="w-7 h-7 rounded-full object-cover border border-[#1F5946]"
                    />
                    <span className="text-xs font-bold text-slate-800">{currentUser.name.split(' ')[0]}</span>
                    <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>
                  </button>

                  {userDropdownOpen && (
                    <div className="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 text-xs">
                      <div className="px-4 py-2 border-b border-slate-100">
                        <div className="font-bold text-slate-800">{currentUser.name}</div>
                        <div className="text-[10px] text-slate-400 truncate">{currentUser.email}</div>
                      </div>
                      <button
                        onClick={() => { onLogout(); setUserDropdownOpen(false); }}
                        className="w-full text-left px-4 py-2 text-red-600 font-semibold hover:bg-red-50 transition flex items-center space-x-2"
                      >
                        <Icons.LogOut />
                        <span>Keluar Akun</span>
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <button
                  onClick={() => onOpenAuth('login')}

      useEffect(() => {
        setIsLogin(mode === 'login');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email || !password || (!isLogin && !name)) {
          alert("Silakan lengkapi formulir.");
          return;
        }

        const userName = isLogin ? (email.split('@')[0] || 'Donatur') : name;
        onLoginSuccess({
          name: userName,
          email: email,
          avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(userName)}`
        });
      };

      const handleGoogleAuth = async () => {
        try {
          if (window.firebaseAuth && window.GoogleAuthProvider && window.signInWithPopup) {
            const provider = new window.GoogleAuthProvider();
            provider.addScope('profile');
            provider.addScope('email');
            const result = await window.signInWithPopup(window.firebaseAuth, provider);
            const user = result.user;
            onLoginSuccess({
              name: user.displayName || user.email.split('@')[0],
              email: user.email,
              avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(user.email)}`
            });
          } else {
            // Membuka Halaman Google OAuth / Account Chooser Resmi secara langsung
            window.open("https://accounts.google.com/v3/signin/accountchooser", "_blank", "width=520,height=640");
          }
        } catch (err) {
          console.error("Google Login Error:", err);
          window.open("https://accounts.google.com/v3/signin/accountchooser", "_blank", "width=520,height=640");

                    onLoginSuccess({

                          value={settings.instagram}
                          onChange={(e) => setSettings({ ...settings, instagram: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                    </div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">WhatsApp Layanan</label>
                        <input
                          type="text"
                          value={settings.whatsapp}
                          onChange={(e) => setSettings({ ...settings, whatsapp: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Email Lembaga</label>
                        <input
                          type="email"
                          value={settings.email}
                          onChange={(e) => setSettings({ ...settings, email: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Alamat Kantor</label>
                      <input
                        type="text"
                        value={settings.address}
                        onChange={(e) => setSettings({ ...settings, address: e.target.value })}
                        className="w-full p-2.5 border rounded-xl"
                      />
                    </div>

                    <button
                      type="button"
                      onClick={() => showToast("Pengaturan berhasil disimpan!")}
                      className="w-full py-3 bg-[#1F5946] hover:bg-[#174435] text-white font-bold rounded-xl transition"
                    >
                      Simpan Perubahan
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
