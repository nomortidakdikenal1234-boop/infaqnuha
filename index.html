        // --- HERO BANNER AUTOMATIC SLIDER IMAGES ---
        let currentSlideIndex = 0;
        let heroSlideInterval = null;
        let activeSlideLayer = 0;

        function startHeroAutoSlide() {
            if (heroSlideInterval) clearInterval(heroSlideInterval);
            const slides = DB.heroSlides && DB.heroSlides.length ? DB.heroSlides : initialDB.heroSlides;
            heroSlideInterval = setInterval(() => {
                const nextIndex = (currentSlideIndex + 1) % slides.length;
                const layerA = document.getElementById('hero-bg-layer-a');
                const layerB = document.getElementById('hero-bg-layer-b');
                
                if (layerA && layerB) {
                    if (activeSlideLayer === 0) {
                        layerB.style.backgroundImage = `url('${slides[nextIndex]}')`;
                        layerB.style.opacity = '1';
                        layerA.style.opacity = '0';
                        activeSlideLayer = 1;
                    } else {
                        layerA.style.backgroundImage = `url('${slides[nextIndex]}')`;
                        layerA.style.opacity = '1';
                        layerB.style.opacity = '0';
                        activeSlideLayer = 0;
                    }
                }
                currentSlideIndex = nextIndex;
            }, 5000);
        }

                state.currentTab = 'adminLogin';

        function setCheckoutAmount(amt) {
            const input = document.getElementById('manual-checkout-amount');
            if (input) input.value = amt;
        }

        function submitInfaqDonation() {
            const amt = parseFloat(document.getElementById('manual-checkout-amount')?.value || 0);
            const name = document.getElementById('donor-name')?.value || 'Hamba Allah';
            const method = document.getElementById('payment-method-select')?.value || 'QRIS';

            if (amt < 10000) {
                alert('Minimal infak adalah Rp 10.000');
                return;
            }

            const newDonation = {
                id: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
                nama: name,
                nominal: amt,
                metode: method,
                status: 'Menunggu Verifikasi',
                tanggal: new Date().toISOString().split('T')[0],
                programId: 1,
                anonim: name === 'Hamba Allah',
                doa: document.getElementById('donor-message')?.value || 'Bismillah'
            };

            DB.donations.unshift(newDonation);
            DB.stats.totalInfaq += amt;
            DB.stats.totalDonatur += 1;
            saveDB();

            alert(`Jazakallah Khairan! Infak sebesar ${formatRupiah(amt)} berhasil dicatat. Silakan lakukan konfirmasi pembayaran.`);
            navigateTo('konfirmasi-donasi');
        }

        function openInfakCheckout(categoryName) {
            state.selectedCategorySlug = categoryName.replace(/\s+/g, '-');
            navigateTo('checkout');
        }

        function triggerInfakCheckoutFromHero() {
            const val = document.getElementById('hero-infak-select')?.value || 'Infak Umum';
            openInfakCheckout(val);
        }

            switchAiView('chatting');
            setTimeout(() => {

                if (input) input.value = text;
                handleAiSend();
            }, 100);
        }

        function handleAiSend() {
            const input = document.getElementById('ai-chat-input');
            const txt = input ? input.value.trim() : '';
            if (!txt) return;

            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            state.chatMessages.push({ sender: 'user', text: txt, time: time });

            let reply = "Terima kasih telah bertanya. Untuk informasi lebih mendalam, Bapak/Ibu dapat menghubungi admin Lembaga Infaq NUHA melalui tombol WhatsApp yang tersedia.";
            const lower = txt.toLowerCase();

            if (lower.includes('donasi') || lower.includes('cara') || lower.includes('infaq')) {
                reply = "Untuk berdonasi, Anda dapat memilih menu 'Infak & Ziswaf' atau memilih peruntukan infak di halaman utama, lalu transfer melalui QRIS atau Bank BSI/Muamalat.";
            } else if (lower.includes('layanan') || lower.includes('program')) {
                reply = "Layanan utama NUHA mencakup Beasiswa Santri Yatim, Pembangunan Infrastruktur Pesantren, dan Program Pemberdayaan Ekonomi Umat.";
            }

            setTimeout(() => {
                state.chatMessages.push({ sender: 'ai', text: reply, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
                renderApp();
            }, 500);

            if (input) input.value = '';
            renderApp();
        }

                                        <h5 class="font-bold text-gray-900">${g.judul}</h5>
                                        <button onclick="deleteGalleryAdmin(${g.id})" class="text-red-500 font-bold hover:underline">Hapus Foto</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${state.adminSubTab === 'berita' ? `
                        <div class="bg-white p-6 border border-gray-100 rounded-3xl shadow-sm space-y-6">
                            <h3 class="font-bold text-sm">Tulis Berita Baru & Tautkan Program (Opsional)</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                <input type="text" id="news-judul" placeholder="Judul Berita" class="p-3 border rounded-2xl">
                                <div class="flex gap-2">
                                    <input type="text" id="news-foto" placeholder="URL Foto Utama Berita" class="flex-1 p-3 border rounded-2xl">
                                    <input type="file" id="news-file" accept="image/*" onchange="handleImageUpload(event, 'news-foto')" class="hidden">
                                    <button onclick="document.getElementById('news-file').click()" class="px-3 bg-gray-100 rounded-2xl font-bold">Upload</button>
                                </div>

                                <div class="sm:col-span-2 space-y-1">
                                    <label class="font-bold text-gray-700">Pilih Program yang Ingin Dipasang pada Berita Ini (Opsional):</label>
                                    <select id="news-program-link" class="w-full p-3 border border-gray-200 rounded-2xl bg-white font-semibold text-gray-800">
                                        <option value="">-- Tanpa Program (Hanya Berita Biasa) --</option>
                                        ${DB.programs.map(p => `<option value="${p.id}">${p.judul} (${p.kategori})</option>`).join('')}
                                    </select>
                                </div>

                                <textarea id="news-ringkasan" rows="3" placeholder="Ringkasan Isi Berita..." class="sm:col-span-2 p-3 border rounded-2xl"></textarea>
                            </div>

                                <h4 class="font-bold text-xs text-gray-700">Daftar Berita</h4>

                                    const linkedProg = DB.programs.find(p => p.id === n.programId);

                                        <div class="flex items-center justify-between p-4 border border-gray-100 rounded-2xl text-xs">
                                            <div class="flex items-center gap-3">
                                                <img src="${n.foto}" class="w-12 h-12 object-cover rounded-xl">
                                                <div>
                                                    <h5 class="font-bold text-gray-900">${n.judul}</h5>
                                                    <span class="text-emerald-600 font-semibold">${linkedProg ? 'Terhubung Program: ' + linkedProg.judul : 'Tanpa Program'}</span>
                                                </div>
                                            </div>
                                            <button onclick="deleteNewsAdmin(${n.id})" class="text-red-500 font-bold hover:underline">Hapus</button>

        // --- CMS ADMIN ACTION HANDLERS ---
        function handleImageUpload(event, targetInputId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const input = document.getElementById(targetInputId);
                    if (input) input.value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function addHeroSlide() {
            const url = document.getElementById('new-slide-url')?.value.trim();
            if (url) {
                DB.heroSlides.push(url);
                saveDB();
                alert('Foto Slide Hero berhasil ditambahkan!');
                renderApp();
            }
        }

        function removeHeroSlide(index) {
            if (DB.heroSlides.length <= 1) {
                alert('Minimal harus ada 1 slide hero!');
                return;
            }
            DB.heroSlides.splice(index, 1);
            saveDB();
            renderApp();
        }

        function addProgramAdmin() {
            const judul = document.getElementById('prog-judul')?.value;
            const kategori = document.getElementById('prog-kategori')?.value;
            const target = parseFloat(document.getElementById('prog-target')?.value || 0);
            const foto = document.getElementById('prog-foto')?.value || 'https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80';
            const desc = document.getElementById('prog-desc')?.value;

            if (judul && target > 0) {
                DB.programs.unshift({
                    id: Date.now(),
                    judul: judul,
                    kategori: kategori,
                    deskripsi: desc || 'Program kebaikan NUHA',
                    target: target,
                    terkumpul: 0,
                    foto: foto
                });
                saveDB();
                alert('Program Unggulan berhasil dipublikasikan!');
                renderApp();
            }
        }

        function deleteProgramAdmin(id) {
            DB.programs = DB.programs.filter(p => p.id !== id);
            saveDB();
            renderApp();
        }

        function addGalleryAdmin() {
            const judul = document.getElementById('gal-judul')?.value;
            const foto = document.getElementById('gal-foto')?.value;
            if (judul && foto) {
                DB.gallery.unshift({
                    id: Date.now(),
                    judul: judul,
                    foto: foto,
                    tanggal: new Date().toISOString().split('T')[0]
                });
                saveDB();
                alert('Foto berhasil disimpan ke Galeri!');
                renderApp();
            }
        }

        function deleteGalleryAdmin(id) {
            DB.gallery = DB.gallery.filter(g => g.id !== id);
            saveDB();
            renderApp();
        }

        function addNewsAdmin() {
            const judul = document.getElementById('news-judul')?.value;
            const foto = document.getElementById('news-foto')?.value;
            const ringkasan = document.getElementById('news-ringkasan')?.value;
            const progId = document.getElementById('news-program-link')?.value;

            if (judul && ringkasan) {
                DB.news.unshift({
                    id: Date.now(),
                    judul: judul,
                    tanggal: new Date().toISOString().split('T')[0],
                    ringkasan: ringkasan,
                    foto: foto || 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80',
                    programId: progId ? parseInt(progId) : null
                });
                saveDB();
                alert('Berita berhasil diterbitkan!');
                renderApp();
            }
        }

        function deleteNewsAdmin(id) {
            DB.news = DB.news.filter(n => n.id !== id);
            saveDB();
            renderApp();
        }

        function setAdminTab(tab) {
            state.adminSubTab = tab;
            renderApp();
        }

        function saveAiSettings() {
            const val = document.getElementById('ai-welcome-msg')?.value;
            if (val) {
                DB.settings.welcomeMessage = val;
                saveDB();
                alert('Pengaturan Linuha AI berhasil disimpan!');
            }
        }

        function logoutAdmin() {
            state.isAuthenticated = false;
            state.adminUser = null;
            navigateTo('home');
        }

        function navigateTo(tab) {
            state.currentTab = tab;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
