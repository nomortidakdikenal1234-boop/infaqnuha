<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembaga Infaq Nurul Hayah</title>
    <link rel="icon" type="image/jpeg" href="https://www.upload.ee/image/19930797/Primary_Logo_1.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nuha: { primary: '#286B56', dark: '#144e36', gold: '#B99A62' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Poppins', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            color: #333333;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
        }
        body.dark-mode nav,
        body.dark-mode div.bg-white,
        body.dark-mode section.bg-white,
        body.dark-mode div.bg-gray-50,
        body.dark-mode main {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        body.dark-mode .text-gray-900,
        body.dark-mode .text-gray-800,
        body.dark-mode .text-gray-700 {
            color: #f1f5f9 !important;
        }
        body.dark-mode .text-gray-600,
        body.dark-mode .text-gray-500 {
            color: #cbd5e1 !important;
        }
        body.dark-mode .border-gray-100,
        body.dark-mode .border-gray-200 {
            border-color: #334155 !important;
        }

        @keyframes shimmerSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,215,0,0.45) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shimmerSlide 2.5s infinite;
        }

        .program-card-track {
            display: flex;
            gap: 1.5rem;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col relative">

    <div id="app-root" class="w-full min-h-screen flex flex-col"></div>

    <!-- MODAL POPUP LOGIN DONATUR -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 transition-opacity duration-300">
        <div class="max-w-md w-full bg-white rounded-[28px] p-8 shadow-2xl relative border border-gray-100 space-y-6">
            <button onclick="closeLoginModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-600 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="text-left space-y-1">
                <h2 id="modal-auth-title" class="text-2xl font-bold font-sans text-slate-900">Masuk ke Akun Anda</h2>
                <p id="modal-auth-desc" class="text-sm text-gray-500 font-normal">Silakan masuk untuk melanjutkan</p>
            </div>

            <button onclick="loginWithGoogleModal()" class="w-full py-3.5 px-4 border border-gray-200 rounded-full text-sm font-semibold text-gray-700 bg-white hover:bg-gray-50 transition flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Masuk dengan Google</span>
            </button>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-xs text-gray-400 font-normal">Atau masuk dengan email</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <form onsubmit="event.preventDefault(); submitModalLogin();" class="space-y-4 text-left">
                <div id="reg-extra-fields" class="hidden space-y-4">
                    <div>
                        <label class="text-sm font-semibold text-gray-800">Nama Lengkap <span class="text-rose-500">*</span></label>
                        <input type="text" id="modal-reg-name" placeholder="Nama Lengkap" class="w-full mt-1.5 p-3.5 border border-gray-200 rounded-xl text-sm">
                    </div>
                </div>

                <div>
                    <label class="text-sm font-semibold text-gray-800">Email <span class="text-rose-500">*</span></label>
                    <input type="email" id="modal-email" placeholder="email@example.com" class="w-full mt-1.5 p-3.5 border border-gray-200 rounded-xl text-sm" required>
                </div>

                <div>
                    <label class="text-sm font-semibold text-gray-800">Password <span class="text-rose-500">*</span></label>
                    <div class="relative mt-1.5">
                        <input type="password" id="modal-password" placeholder="Masukkan password" class="w-full p-3.5 pr-11 border border-gray-200 rounded-xl text-sm" required>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                            <i data-lucide="eye" id="pass-eye-icon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="modal-btn-submit" class="w-full py-3.5 bg-[#146438] text-white font-bold text-base rounded-full hover:bg-[#0f4e2b] transition shadow-md mt-2">
                    Masuk
                </button>
            </form>

            <div class="text-center pt-2 border-t border-gray-100">
                <p id="modal-toggle-prompt" class="text-xs text-gray-500">
                    Belum punya akun? 
                    <button onclick="toggleModalAuthMode(true)" class="text-[#146438] font-bold hover:underline">Daftar Sekarang</button>
                </p>
            </div>
        </div>
    </div>

    <script>
        const OFFICIAL_LOGO = "https://www.upload.ee/image/19930797/Primary_Logo_1.jpg";

        const initialDB = {
            settings: {
                siteName: "Lembaga Infaq Nurul Hayah",
                siteLogo: OFFICIAL_LOGO,
                phone: "+6282333362299",
                isLocked: false,
                lockMessage: "Website sedang dalam pemeliharaan sistem. Silakan kembali beberapa saat lagi.",
                disableDonations: false,
                socials: {
                    whatsapp: "https://wa.me/6282333362299",
                    instagram: "https://www.instagram.com/lembagainfaqnurulhayah",
                    youtube: "https://youtube.com",
                    tiktok: "https://tiktok.com",
                    facebook: "https://facebook.com"
                },
                aboutText: "Lembaga Infaq NUHA hadir untuk berkhidmat dalam rangka membantu kesejahteraan dan kemandirian umat; mengangkat harkat sosial dengan mendayagunakan dana Zakat, Infak, Sedekah (ZIS), CSR, serta Dana Sosial Keagamaan Lainnya (DSKL) sesuai regulasi dan ketentuan syariah.",
                visiText: "Menjadi Lembaga Infaq terdepan dalam mewujudkan kesejahteraan sosial dan pendidikan yang merata, berkualitas, dan berkelanjutan bagi masyarakat kurang mampu.",
                misiText: "• Akses Pendidikan Layak bagi anak yatim & dhuafa\n• Pengembangan Fasilitas Sekolah & Asrama\n• Inovasi Keterampilan & Teknologi Santri\n• Pengelolaan Akuntabel & Transparan"
            },
            paymentMethods: [
                { id: 1, name: "Bank Syariah Indonesia (BSI)", account: "7123-4567-89 a.n NUHA", qrImage: "", active: true },
                { id: 2, name: "Bank Muamalat", account: "345-00123-99 a.n NUHA", qrImage: "", active: true },
                { id: 3, name: "QRIS All Payment Resmi NUHA", account: "Scan Barcode QRIS Sangat Mudah", qrImage: "https://placehold.co/400x400/286B56/FFFFFF?text=QRIS+NUHA", active: true }
            ],
            pengurusList: [],
            stats: { totalInfaq: 0, totalDonatur: 0 },
            heroSlides: [],
            gallery: [],
            infaqCategories: [
                { id: 'yatim', name: 'Infak Anak Yatim', icon: 'heart' },
                { id: 'dakwah', name: 'Infak Dakwah & Kemanusiaan', icon: 'book-open' },
                { id: 'ekonomi', name: 'Infak Ekonomi', icon: 'trending-up' },
                { id: 'jumat', name: 'Infak Jumat Berkah', icon: 'sun' },
                { id: 'kesehatan', name: 'Infak Kesehatan', icon: 'activity' },
                { id: 'lingkungan', name: 'Infak Lingkungan', icon: 'trees' },
                { id: 'pendidikan', name: 'Infak Pendidikan', icon: 'graduation-cap' },
                { id: 'subuh', name: 'Infak Subuh', icon: 'sunrise' },
                { id: 'umum', name: 'Infak Umum', icon: 'coins' }
            ],
            programs: [],
            news: [],
            pendingConfirmations: [],
            blockedIPs: [],
            logs: []
        };

        let DB = JSON.parse(localStorage.getItem('NUHA_DATABASE')) || initialDB;

        function saveDB() {
            localStorage.setItem('NUHA_DATABASE', JSON.stringify(DB));
        }

        let state = {
            currentTab: 'home',
            selectedCategorySlug: 'Infak-Umum',
            isDarkMode: localStorage.getItem('NUHA_THEME') === 'dark'
        };

        let currentProgramIndex = 0;
        let programAutoSlideInterval = null;
        let isProgramPaused = false;
        let currentHeroSlideIndex = 0;

        function startProgramAutoSlide() {
            if (programAutoSlideInterval) clearInterval(programAutoSlideInterval);
            programAutoSlideInterval = setInterval(() => {
                if (!isProgramPaused) {
                    moveProgramSlide(1, false);
                }
            }, 3500);
        }

        function pauseProgramAutoSlide() { isProgramPaused = true; }
        function resumeProgramAutoSlide() { isProgramPaused = false; }

        function moveProgramSlide(direction, isUserClick = true) {
            const track = document.getElementById('program-card-track');
            if (!track) return;
            const totalItems = DB.programs ? DB.programs.length : 0;
            if (totalItems === 0) return;

            if (isUserClick) {
                pauseProgramAutoSlide();
                setTimeout(() => { resumeProgramAutoSlide(); }, 4000);
            }

            currentProgramIndex += direction;
            if (currentProgramIndex >= totalItems) {
                currentProgramIndex = 0;
            } else if (currentProgramIndex < 0) {
                currentProgramIndex = totalItems - 1;
            }

            const cardWidthWithGap = 344;
            track.style.transform = `translateX(-${currentProgramIndex * cardWidthWithGap}px)`;
        }

        function getProgramRaisedAmount(prog) {
            if (!prog) return 0;
            if (prog.calcMode === 'manual') {
                return prog.terkumpulManual !== undefined ? prog.terkumpulManual : (prog.terkumpul || 0);
            }
            const autoAmount = (DB.pendingConfirmations || [])
                .filter(c => c.status && c.status.includes('Berhasil') && (c.programId === prog.id || (c.trxCode && c.trxCode.includes(prog.id))))
                .reduce((sum, c) => sum + (c.amount || 0), prog.terkumpulAwal || 0);
            
            return autoAmount || prog.terkumpul || 0;
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function applyTheme() {
            if (state.isDarkMode) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        function toggleTheme() {
            state.isDarkMode = !state.isDarkMode;
            localStorage.setItem('NUHA_THEME', state.isDarkMode ? 'dark' : 'light');
            renderApp();
        }

        function renderApp() {
            applyTheme();
            const root = document.getElementById('app-root');
            root.innerHTML = '';
            document.title = DB.settings.siteName || "Lembaga Infaq Nurul Hayah";

            if (DB.settings.isLocked) {
                root.appendChild(renderLockedWebsiteView());
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col min-h-screen justify-between";
            
            wrapper.appendChild(renderPublicNavbar());

            const mainContent = document.createElement('main');
            mainContent.className = "flex-grow";

            switch(state.currentTab) {
                case 'home': mainContent.appendChild(renderHomepage()); break;
                case 'about': mainContent.appendChild(renderAboutPage()); break;
                case 'visi-misi': mainContent.appendChild(renderVisiMisiPage()); break;
                case 'pengurus': mainContent.appendChild(renderPengurusPage()); break;
                case 'program': mainContent.appendChild(renderProgramPage()); break;
                case 'galeri': mainContent.appendChild(renderGaleriPage()); break;
                case 'berita': mainContent.appendChild(renderBeritaPage()); break;
                case 'infak': 
                case 'checkout': mainContent.appendChild(renderInfakCheckoutPage()); break;
                case 'konfirmasi-donasi': mainContent.appendChild(renderKonfirmasiDonasiPage()); break;
                default: mainContent.appendChild(renderHomepage());
            }

            wrapper.appendChild(mainContent);
            wrapper.appendChild(renderPublicFooter());

            root.appendChild(wrapper);

            if (window.lucide) lucide.createIcons();
        }

        function renderLockedWebsiteView() {
            const container = document.createElement('div');
            container.className = "w-full min-h-screen bg-emerald-950 text-white flex flex-col items-center justify-center p-6 text-center font-sans";
            container.innerHTML = `
                <div class="max-w-md w-full bg-emerald-900/40 border border-emerald-800 p-8 rounded-3xl space-y-4 backdrop-blur-md shadow-2xl">
                    <div class="w-16 h-16 bg-emerald-800/80 rounded-2xl flex items-center justify-center mx-auto text-amber-400">
                        <i data-lucide="lock" class="w-8 h-8"></i>
                    </div>
                    <img src="${DB.settings.siteLogo || OFFICIAL_LOGO}" class="h-12 mx-auto object-contain bg-white p-1 rounded-xl">
                    <h2 class="text-2xl font-bold font-poppins">${DB.settings.siteName || 'Lembaga Infaq NUHA'}</h2>
                    <p class="text-xs text-emerald-200 leading-relaxed">${DB.settings.lockMessage}</p>
                </div>
            `;
            return container;
        }

        function renderPublicNavbar() {
            const nav = document.createElement('nav');
            nav.className = "sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm font-sans";
            const logo = DB.settings.siteLogo || OFFICIAL_LOGO;

            nav.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex justify-between h-20 items-center">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('home')">
                            <img src="${logo}" class="h-11 sm:h-12 w-auto object-contain">
                        </div>

                        <div class="hidden lg:flex items-center space-x-7 font-medium text-xs sm:text-sm text-gray-700">
                            <button onclick="navigateTo('home')" class="hover:text-nuha-primary">Beranda</button>
                            <button onclick="navigateTo('about')" class="hover:text-nuha-primary">Tentang LINUHA</button>
                            <button onclick="navigateTo('visi-misi')" class="hover:text-nuha-primary">Visi & Misi</button>
                            <button onclick="navigateTo('pengurus')" class="hover:text-nuha-primary">Pengurus</button>
                            <button onclick="navigateTo('program')" class="hover:text-nuha-primary">Program LINUHA</button>
                            <button onclick="navigateTo('galeri')" class="hover:text-nuha-primary">Galeri LINUHA</button>
                            <button onclick="navigateTo('berita')" class="hover:text-nuha-primary">Berita</button>
                            <button onclick="navigateTo('konfirmasi-donasi')" class="hover:text-nuha-primary">Konfirmasi Donasi</button>
                        </div>

                        <div class="flex items-center space-x-3">
                            <button onclick="toggleTheme()" class="p-2.5 rounded-xl border border-gray-200 hover:bg-gray-100">
                                <i data-lucide="${state.isDarkMode ? 'sun' : 'moon'}" class="w-4 h-4"></i>
                            </button>
                            <button onclick="openLoginModal()" class="btn-shimmer px-6 py-2.5 text-sm font-bold text-white bg-[#146438] hover:bg-[#0f4e2b] rounded-full transition shadow-md">
                                Masuk
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return nav;
        }

        function renderHomepage() {
            const container = document.createElement('div');
            container.className = "bg-white space-y-12 pb-16 font-sans overflow-hidden";

            const slides = DB.heroSlides || [];
            const hasSlides = slides.length > 0;
            const currentSlide = hasSlides ? slides[currentHeroSlideIndex] : null;

            container.innerHTML = `
                <!-- HERO SLIDE HEADER -->
                <section class="relative bg-gray-900 text-white w-full h-[320px] sm:h-[400px] flex items-center overflow-hidden">
                    ${hasSlides ? `
                        <div class="absolute inset-0 bg-cover bg-center transition-all duration-700" style="background-image: url('${currentSlide.foto}');"></div>
                        <div class="absolute inset-0 bg-gradient-to-r from-gray-950/80 via-gray-950/50 to-transparent"></div>
                        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full z-10">
                            <div class="max-w-2xl space-y-3">
                                <h1 class="text-2xl sm:text-4xl font-bold font-poppins">${currentSlide.judul}</h1>
                                <p class="text-xs sm:text-sm text-gray-100">${currentSlide.subjudul || ''}</p>
                            </div>
                        </div>
                    ` : `
                        <div class="absolute inset-0 bg-gradient-to-br from-[#0f4e2b] to-[#146438]"></div>
                        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full z-10 text-center">
                            <h1 class="text-2xl sm:text-4xl font-bold font-poppins">${DB.settings.siteName}</h1>
                            <p class="text-xs sm:text-sm text-emerald-100 mt-2">Mari raih keberkahan bersama Lembaga Infaq Nurul Hayah.</p>
                        </div>
                    `}
                </section>

                <!-- PERUNTUKAN INFAK -->
                <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8 pt-4">
                    <div class="text-center">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-gray-900">Pilih Peruntukan Infak</h2>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                        ${(DB.infaqCategories||[]).map(cat => `
                            <div onclick="openInfakCheckout('${cat.name}')" class="p-5 border border-gray-100 rounded-3xl bg-white hover:border-nuha-primary transition cursor-pointer space-y-3 shadow-xs hover:shadow-md">
                                <i data-lucide="${cat.icon}" class="w-6 h-6 text-nuha-primary"></i>
                                <h3 class="font-bold text-xs sm:text-sm text-gray-900">${cat.name}</h3>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <!-- PROGRAM LINUHA (CAROUSEL SLIDER) -->
                <section class="space-y-6 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-gray-900">Program LINUHA</h2>
                        ${(DB.programs||[]).length > 0 ? `
                            <div class="flex items-center gap-2" onmouseenter="pauseProgramAutoSlide()" onmouseleave="resumeProgramAutoSlide()">
                                <button onclick="moveProgramSlide(-1)" class="w-10 h-10 rounded-full border border-gray-200 bg-white hover:bg-emerald-50 flex items-center justify-center shadow-xs">
                                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                                </button>
                                <button onclick="moveProgramSlide(1)" class="w-10 h-10 rounded-full border border-gray-200 bg-white hover:bg-emerald-50 flex items-center justify-center shadow-xs">
                                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    ${(DB.programs||[]).length === 0 ? `
                        <div class="p-12 text-center border-2 border-dashed border-gray-200 rounded-3xl bg-gray-50/50">
                            <i data-lucide="folder-open" class="w-12 h-12 mx-auto text-gray-300"></i>
                            <p class="text-sm font-semibold text-gray-500 mt-2">Belum ada program LINUHA yang diterbitkan.</p>
                            <p class="text-xs text-gray-400">Silakan tambahkan program melalui CMS Panel Admin.</p>
                        </div>
                    ` : `
                        <div class="relative w-full overflow-hidden py-2" onmouseenter="pauseProgramAutoSlide()" onmouseleave="resumeProgramAutoSlide()">
                            <div id="program-card-track" class="program-card-track">
                                ${DB.programs.map(prog => {
                                    const amount = getProgramRaisedAmount(prog);
                                    const pct = Math.min(100, Math.round((amount / (prog.target||1))*100));
                                    return `
                                        <div class="w-[320px] shrink-0 border border-gray-100 rounded-3xl overflow-hidden bg-white shadow-sm flex flex-col justify-between">
                                            <img src="${prog.foto || 'https://placehold.co/600x400/286B56/FFFFFF?text=Program+NUHA'}" class="h-44 w-full object-cover">
                                            <div class="p-6 space-y-4">
                                                <span class="text-xs font-bold text-nuha-primary block">${prog.kategori || 'Program'}</span>
                                                <h3 class="font-bold text-base text-gray-900 line-clamp-1">${prog.judul}</h3>
                                                <div class="space-y-1">
                                                    <div class="flex justify-between text-xs font-semibold">
                                                        <span>Terkumpul: ${formatRupiah(amount)}</span>
                                                        <span>Target: ${formatRupiah(prog.target)}</span>
                                                    </div>
                                                    <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                        <div class="bg-nuha-primary h-full" style="width: ${pct}%"></div>
                                                    </div>
                                                </div>
                                                <button onclick="openInfakCheckout('${prog.judul}')" class="btn-shimmer w-full py-2.5 bg-nuha-primary text-white font-bold text-xs rounded-xl hover:bg-nuha-dark">Donasi Sekarang &rarr;</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `}
                </section>

                <!-- GALERI LINUHA HOMEPAGE PREVIEW -->

        function submitInfaqDonation() {
            const amt = parseFloat(document.getElementById('manual-checkout-amount')?.value || 0);
            const name = document.getElementById('donor-name')?.value || 'Hamba Allah';

            if (amt >= 10000) {
                alert(`Terima kasih ${name}, infak sebesar ${formatRupiah(amt)} berhasil diinisiasi. Silakan lakukan transfer dan isi form konfirmasi!`);
                navigateTo('konfirmasi-donasi');
            } else {
                alert('Nominal infak minimal adalah Rp 10.000');
            }
        }

            const container = document.createElement('div');
            container.className = "py-16 bg-white font-sans min-h-[70vh] flex items-center";
            container.innerHTML = `

                        <h1 class="text-3xl font-bold font-poppins text-gray-900">Konfirmasi Transfer Donasi</h1>

                    </div>

                    <form onsubmit="event.preventDefault(); submitConfirmDonation();" class="p-8 border border-gray-100 rounded-3xl space-y-4 shadow-sm bg-white">
                        <div>

                        </div>
                        <button type="submit" class="btn-shimmer w-full py-3.5 bg-nuha-primary text-white font-bold text-xs rounded-xl hover:bg-nuha-dark shadow-md">Kirim Konfirmasi Ke Admin &rarr;</button>

                </div>
            `;
            return container;
        }

        function submitConfirmDonation() {
            const trx = document.getElementById('confirm-trx')?.value;
            const name = document.getElementById('confirm-name')?.value;
            const amount = parseFloat(document.getElementById('confirm-amount')?.value || 0);

            if (trx && name && amount) {
                if(!DB.pendingConfirmations) DB.pendingConfirmations = [];
                DB.pendingConfirmations.unshift({
                    id: Date.now(),
                    trxCode: trx,
                    donorName: name,
                    amount: amount,
                    status: 'Menunggu Verifikasi Admin',
                    timestamp: new Date().toLocaleString('id-ID')
                });
                saveDB();
                alert('Konfirmasi transfer berhasil dikirim ke Admin Panel!');
                navigateTo('home');
            }
        }

        function openLoginModal() {
            document.getElementById('login-modal')?.classList.remove('hidden');
            document.getElementById('login-modal')?.classList.add('flex');
        }

        function closeLoginModal() {
            document.getElementById('login-modal')?.classList.add('hidden');
            document.getElementById('login-modal')?.classList.remove('flex');
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('modal-password');
            if (passInput) passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        function toggleModalAuthMode(isRegister) {
            const extra = document.getElementById('reg-extra-fields');
            if (isRegister) extra?.classList.remove('hidden');
            else extra?.classList.add('hidden');
        }

        function submitModalLogin() {
            const email = document.getElementById('modal-email')?.value;
            if (email) {
                closeLoginModal();
                alert(`Login Berhasil sebagai ${email}`);
            }
        }

        function openInfakCheckout(cat) {

        function navigateTo(tab) {
            state.currentTab = tab;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
        }

            renderApp();
        };
