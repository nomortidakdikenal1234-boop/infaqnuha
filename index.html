    function InfaqFormView({ programs, selectedProgram, settings, onSubmitInfaq, successData, onReset, onBack, showToast }) {
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        email: '',
        isAnon: false,
        amount: '50000',
        customAmount: '',
        programTitle: selectedProgram ? selectedProgram.title : (programs[0]?.title || "Infaq Umum"),
        paymentMethod: "WhatsApp Transfer",
        notes: ''
      });

      const presetAmounts = ["10000", "25000", "50000", "100000", "250000", "500000"];

      const handleNominalClick = (val) => {
        setFormData({ ...formData, amount: val, customAmount: '' });
      };

      const handleCustomNominal = (e) => {
        const raw = e.target.value.replace(/\D/g, '');
        setFormData({ ...formData, amount: raw, customAmount: raw });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalAmount = Number(formData.amount);
        if (!finalAmount || finalAmount < 5000) {
          showToast("Nominal infaq minimal Rp 5.000");
          return;
        }

        const donorName = formData.isAnon ? "Hamba Allah" : (formData.name || "Hamba Allah");
        const cleanWA = settings.whatsapp.replace(/\D/g, '');

        let waText = `Assalamualaikum Lembaga Infaq Nurul Hayah,\n\n`;
        waText += `Saya ingin menyalurkan infaq dengan rincian berikut:\n`;
        waText += `• Nama: ${donorName}\n`;
        waText += `• Nominal Infaq: ${formatIDR(finalAmount)}\n`;
        waText += `• Program: ${formData.programTitle}\n`;
        if (formData.phone) waText += `• No. WA/HP: ${formData.phone}\n`;
        if (formData.notes) waText += `• Doa/Niat: ${formData.notes}\n`;
        waText += `\nMohon informasi Nomor Rekening / QRIS untuk pengiriman infaq. Terima kasih.`;

        const waUrl = `https://wa.me/${cleanWA}?text=${encodeURIComponent(waText)}`;

        onSubmitInfaq(formData);
        window.open(waUrl, '_blank');
      };

      if (successData) {
        return (
          <div className="max-w-xl mx-auto px-4 py-16">
            <div className="bg-white rounded-3xl p-8 shadow-2xl border border-slate-200 text-center space-y-6">
              <div className="w-16 h-16 bg-emerald-50 text-[#1F5946] border border-emerald-200 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">

              </div>

              <div className="p-5 bg-slate-50 rounded-2xl border border-slate-200 text-left space-y-3 text-xs">
                <div className="flex justify-between border-b pb-2">

                  <span className="font-bold text-slate-800 text-right max-w-xs">{successData.programTitle}</span>

                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Nominal Infaq:</span>
                  <span className="font-black text-[#1F5946] text-base">{formatIDR(successData.amount)}</span>
                </div>
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Nama Donatur:</span>
                  <span className="font-semibold text-slate-800">{successData.donorName}</span>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3 pt-2">
                <a
                  href={`https://wa.me/${settings.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(`Assalamualaikum Lembaga Infaq Nurul Hayah,\n\nSaya ingin meminta Nomor Rekening / QRIS untuk transaksi ID: ${successData.id} sebesar ${formatIDR(successData.amount)}`)}`}

                  rel="noopener noreferrer"
                  className="flex-1 py-3.5 bg-[#1F5946] hover:bg-[#174435] text-white rounded-xl font-bold text-sm flex items-center justify-center space-x-2 shadow-md"

                  <Icons.WhatsApp />
                  <span>Buka WhatsApp (Minta Rekening / QRIS)</span>
                </a>
                <button
                  onClick={() => { onReset(); onBack(); }}

                >
                  Selesai
                </button>
              </div>
            </div>
          </div>
        );

              <p className="text-slate-500 text-xs sm:text-sm mt-1">

                      className={`py-3 px-2 rounded-2xl text-xs font-bold border transition-all ${

                    onChange={handleCustomNominal}
                    className="w-full pl-12 pr-4 py-3 bg-white border border-slate-300 rounded-2xl text-sm font-bold text-[#1F5946] focus:ring-2 focus:ring-[#1F5946] outline-none"

                </div>

                  />

                <div className="flex items-center space-x-2">

                Masuk ke Dashboard
              </button>
            </form>

            <div className="mt-6 pt-6 border-t border-slate-100 text-center">
              <button
                onClick={onBackToHome}
                className="text-xs text-slate-500 hover:text-slate-800 font-semibold transition"

                ← Kembali ke Web Publik
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AdminDashboardView({
      adminTab, setAdminTab, adminUser, onLogout, stats,
      programs, setPrograms, donations, setDonations,
      gallery, setGallery, settings, setSettings, adminLogs, showToast, dbConnected
    }) {
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [editingProgram, setEditingProgram] = useState(null);
      const [newProgramModal, setNewProgramModal] = useState(false);
      const [programForm, setProgramForm] = useState({
        title: '', category: 'Pendidikan', description: '', fullContent: '',
        targetAmount: 50000000, currentAmount: 0, beneficiaries: 0,
        imageUrl: 'https://images.unsplash.com/photo-1588072432836-e10032774350?auto=format&fit=crop&w=800&q=80',
        status: 'Aktif'
      });

      const [newGalleryModal, setNewGalleryModal] = useState(false);
      const [galleryForm, setGalleryForm] = useState({
        title: '',
        category: 'Pendidikan',
        description: '',
        imageUrl: 'https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80'
      });

      const [donationSearch, setDonationSearch] = useState('');
      const [donationFilterStatus, setDonationFilterStatus] = useState('Semua');

      const handleSaveGallery = async (e) => {
        e.preventDefault();
        const newId = `GAL-${Math.floor(100 + Math.random() * 900)}`;
        const newGalItem = { ...galleryForm, id: newId };
        setGallery([newGalItem, ...gallery]);

        if (supabaseClient) {
          try {
            await supabaseClient.from('gallery').insert([{
              id: newId,
              title: galleryForm.title,
              category: galleryForm.category,
              description: galleryForm.description,
              image_url: galleryForm.imageUrl
            }]);
          } catch (err) {
            console.warn("Supabase insert gallery fallback:", err);
          }
        }

        showToast("Foto galeri baru berhasil ditambahkan!");
        setNewGalleryModal(false);
        setGalleryForm({
          title: '',
          category: 'Pendidikan',
          description: '',
          imageUrl: 'https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80'
        });
      };

      const handleSaveProgram = async (e) => {
        e.preventDefault();
        if (editingProgram) {
          setPrograms(programs.map(p => p.id === editingProgram.id ? { ...programForm, id: editingProgram.id } : p));
          
          if (supabaseClient) {
            try {
              await supabaseClient.from('programs').update({
                title: programForm.title,
                category: programForm.category,
                description: programForm.description,
                full_content: programForm.fullContent,
                target_amount: programForm.targetAmount,
                current_amount: programForm.currentAmount,
                beneficiaries: programForm.beneficiaries,
                image_url: programForm.imageUrl,
                status: programForm.status
              }).eq('id', editingProgram.id);
            } catch (err) {
              console.warn("Supabase update program fallback:", err);
            }
          }

          showToast("Program berhasil diperbarui!");
          setEditingProgram(null);
        } else {
          const newId = `PROG-${Math.floor(100 + Math.random() * 900)}`;
          const newProg = { ...programForm, id: newId };
          setPrograms([newProg, ...programs]);

          if (supabaseClient) {
            try {
              await supabaseClient.from('programs').insert([{
                id: newId,
                title: programForm.title,
                category: programForm.category,
                description: programForm.description,
                full_content: programForm.fullContent,
                target_amount: programForm.targetAmount,
                current_amount: programForm.currentAmount,
                beneficiaries: programForm.beneficiaries,
                image_url: programForm.imageUrl,
                status: programForm.status
              }]);
            } catch (err) {
              console.warn("Supabase insert program fallback:", err);
            }
          }

          showToast("Program baru berhasil ditambahkan!");
          setNewProgramModal(false);
        }
      };

      const handleDeleteProgram = async (id) => {
        setPrograms(programs.filter(p => p.id !== id));
        if (supabaseClient) {
          try {
            await supabaseClient.from('programs').delete().eq('id', id);
          } catch (err) {
            console.warn("Supabase delete program fallback:", err);
          }
        }
        showToast("Program berhasil dihapus.");
      };

      const handleUpdateDonationStatus = async (id, newStatus) => {
        setDonations(donations.map(d => d.id === id ? { ...d, status: newStatus } : d));
        if (supabaseClient) {
          try {
            await supabaseClient.from('donations').update({ status: newStatus }).eq('id', id);
          } catch (err) {
            console.warn("Supabase update donation fallback:", err);
          }
        }
        showToast(`Status transaksi ${id} diubah ke ${newStatus}`);
      };

      const handleSaveSettings = async () => {
        if (supabaseClient) {
          try {
            await supabaseClient.from('settings').upsert([{
              id: 'main_settings',
              org_name: settings.orgName,
              tagline: settings.tagline,
              sub_tagline: settings.subTagline,
              description: settings.description,
              address: settings.address,
              whatsapp: settings.whatsapp,
              email: settings.email,
              tiktok: settings.tiktok,
              instagram: settings.instagram,
              facebook: settings.facebook,
              logo_url: settings.logoUrl
            }]);
          } catch (err) {
            console.warn("Supabase update settings fallback:", err);
          }
        }
        showToast("Pengaturan berhasil disimpan ke Database!");
      };

        { id: 'donors', label: 'Data Donatur', icon: Icons.Users },

                            <div className="text-[10px] text-slate-400 mt-0.5">{l.time} • {l.ip}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {adminTab === 'programs' && (

                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-slate-900 text-base">Seluruh Program ({programs.length})</h3>
                    <button

                        setProgramForm({

                          targetAmount: 50000000, currentAmount: 0, beneficiaries: 0,
                          imageUrl: 'https://images.unsplash.com/photo-1588072432836-e10032774350?auto=format&fit=crop&w=800&q=80',
                          status: 'Aktif'

                        setNewProgramModal(true);
                      }}
                      className="px-4 py-2 bg-[#1F5946] hover:bg-[#174435] text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-sm"
                    >
                      <Icons.Plus />
                      <span>Tambah Program Baru</span>
                    </button>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200 uppercase">
                        <tr>
                          <th className="p-4">Program</th>
                          <th className="p-4">Kategori</th>
                          <th className="p-4">Target & Terkumpul</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {programs.length === 0 ? (
                          <tr>
                            <td colSpan="5" className="p-8 text-center text-slate-400 italic">
                              Belum ada data program yang dibuat. Klik tombol "Tambah Program Baru" di atas untuk menambahkan program pertama Anda.
                            </td>
                          </tr>
                        ) : (
                          programs.map((p) => (
                            <tr key={p.id} className="hover:bg-slate-50">
                              <td className="p-4 flex items-center space-x-3">
                                <img src={p.imageUrl} alt="" className="w-10 h-10 rounded-lg object-cover" />
                                <div>
                                  <div className="font-bold text-slate-800">{p.title}</div>
                                  <div className="text-[10px] text-slate-400">{p.beneficiaries} Penerima Manfaat</div>
                                </div>
                              </td>
                              <td className="p-4 font-semibold text-slate-600">{p.category}</td>
                              <td className="p-4">
                                <div className="font-bold text-[#1F5946]">{formatIDR(p.currentAmount)}</div>
                                <div className="text-[10px] text-slate-400">Target: {formatIDR(p.targetAmount)}</div>
                              </td>
                              <td className="p-4">
                                <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                  p.status === 'Aktif' ? 'bg-emerald-100 text-[#1F5946]' : 'bg-slate-100 text-slate-600'
                                }`}>
                                  {p.status}
                                </span>
                              </td>
                              <td className="p-4 text-right space-x-2">
                                <button
                                  onClick={() => {
                                    setEditingProgram(p);
                                    setProgramForm(p);
                                    setNewProgramModal(true);
                                  }}
                                  className="p-1.5 text-[#1F5946] hover:bg-emerald-50 rounded-lg"
                                  title="Edit"
                                >
                                  <Icons.Edit />
                                </button>
                                <button
                                  onClick={() => handleDeleteProgram(p.id)}
                                  className="p-1.5 text-red-600 hover:bg-red-50 rounded-lg"
                                  title="Hapus"
                                >
                                  <Icons.Trash />
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>

                  {newProgramModal && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
                        <div className="flex justify-between items-center pb-2 border-b">

                            {editingProgram ? "Edit Program" : "Tambah Program Baru"}

                          <button onClick={() => setNewProgramModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                        </div>

                        <form onSubmit={handleSaveProgram} className="space-y-4 text-xs">
                          <div>
                            <label className="block font-bold text-slate-700 mb-1">Nama Program</label>
                            <input
                              type="text"
                              required
                              value={programForm.title}
                              onChange={(e) => setProgramForm({ ...programForm, title: e.target.value })}
                              className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                            />
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block font-bold text-slate-700 mb-1">Kategori</label>
                              <select
                                value={programForm.category}
                                onChange={(e) => setProgramForm({ ...programForm, category: e.target.value })}
                                className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                              >
                                <option value="Pendidikan">Pendidikan</option>
                                <option value="Santunan">Santunan</option>
                                <option value="Wakaf & Pembangunan">Wakaf & Pembangunan</option>
                                <option value="Paket Sembako">Paket Sembako</option>
                                <option value="Ramadhan">Ramadhan</option>
                              </select>
                            </div>
                            <div>
                              <label className="block font-bold text-slate-700 mb-1">Status</label>
                              <select
                                value={programForm.status}
                                onChange={(e) => setProgramForm({ ...programForm, status: e.target.value })}
                                className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                              >
                                <option value="Aktif">Aktif</option>

                              <label className="block font-bold text-slate-700 mb-1">Target Dana (Rp)</label>
                              <input

                                value={programForm.targetAmount}
                                onChange={(e) => setProgramForm({ ...programForm, targetAmount: Number(e.target.value) })}
                                className="w-full p-2.5 border rounded-xl font-bold focus:ring-2 focus:ring-[#1F5946] outline-none"
                              />
                            </div>
                            <div>
                              <label className="block font-bold text-slate-700 mb-1">Dana Terkumpul (Rp)</label>
                              <input
                                type="number"
                                value={programForm.currentAmount}
                                onChange={(e) => setProgramForm({ ...programForm, currentAmount: Number(e.target.value) })}

                      <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200 uppercase">
                        <tr>
                          <th className="p-4">ID & Waktu</th>
                          <th className="p-4">Donatur</th>
                          <th className="p-4">Program</th>
                          <th className="p-4">Nominal</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Verifikasi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {donations.length === 0 ? (
                          <tr>
                            <td colSpan="6" className="p-6 text-center text-slate-400 italic">
                              Belum ada transaksi infaq yang tercatat.
                            </td>
                          </tr>
                        ) : (
                          donations
                            .filter(d => donationFilterStatus === 'Semua' || d.status === donationFilterStatus)
                            .filter(d => d.donorName.toLowerCase().includes(donationSearch.toLowerCase()) || d.id.toLowerCase().includes(donationSearch.toLowerCase()))
                            .map((d) => (
                              <tr key={d.id} className="hover:bg-slate-50">
                                <td className="p-4 font-mono font-bold text-slate-700">
                                  <div>{d.id}</div>
                                  <div className="text-[10px] text-slate-400 font-normal">{d.date}</div>
                                </td>
                                <td className="p-4 font-bold text-slate-900">{d.donorName}</td>
                                <td className="p-4 text-slate-600 max-w-xs truncate">{d.programTitle}</td>
                                <td className="p-4 font-black text-[#1F5946]">{formatIDR(d.amount)}</td>
                                <td className="p-4">
                                  <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                    d.status === 'Terverifikasi' ? 'bg-emerald-100 text-[#1F5946]' :
                                    d.status === 'Pending' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'
                                  }`}>
                                    {d.status}
                                  </span>
                                </td>
                                <td className="p-4 text-right space-x-1">
                                  {d.status === 'Pending' && (
                                    <button
                                      onClick={() => handleUpdateDonationStatus(d.id, 'Terverifikasi')}
                                      className="px-2.5 py-1 bg-[#1F5946] text-white rounded-lg text-[10px] font-bold hover:bg-[#174435]"
                                    >
                                      Verifikasi
                                    </button>
                                  )}
                                </td>
                              </tr>
                            ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {adminTab === 'donors' && (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                  <h3 className="font-bold text-slate-900 text-base">Rekap Donatur Terdaftar</h3>
                  {donations.length === 0 ? (
                    <p className="text-xs text-slate-400 italic">Belum ada donatur yang terdata.</p>
                  ) : (
                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
                      {Array.from(new Set(donations.map(d => d.donorName))).map((name, i) => {
                        const userDonations = donations.filter(d => d.donorName === name);
                        const totalGiven = userDonations.reduce((acc, curr) => acc + curr.amount, 0);
                        return (
                          <div key={i} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                            <div className="flex items-center space-x-3">
                              <div className="w-9 h-9 rounded-full bg-[#1F5946] text-[#B89355] font-bold flex items-center justify-center text-xs">
                                {name.charAt(0)}
                              </div>
                              <div>
                                <div className="font-bold text-sm text-slate-900">{name}</div>
                                <div className="text-[10px] text-slate-400">{userDonations.length}x Infaq</div>
                              </div>
                            </div>
                            <div className="text-xs font-bold text-[#1F5946] border-t pt-2">
                              Total: {formatIDR(totalGiven)}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {adminTab === 'gallery' && (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-slate-900 text-base">Daftar Foto Dokumentasi ({gallery.length})</h3>
                    <button
                      onClick={() => setNewGalleryModal(true)}
                      className="px-4 py-2 bg-[#1F5946] hover:bg-[#174435] text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-sm"
                    >
                      <Icons.Plus />
                      <span>Tambah Foto Galeri</span>
                    </button>
                  </div>

                  {gallery.length === 0 ? (
                    <p className="text-xs text-slate-400 italic">Belum ada foto galeri saat ini. Silakan klik tombol "Tambah Foto Galeri" di atas untuk menambahkan foto baru.</p>
                  ) : (
                    <div className="grid sm:grid-cols-3 gap-4">
                      {gallery.map((g) => (
                        <div key={g.id} className="bg-slate-50 rounded-xl border border-slate-200 p-3 space-y-2">
                          <img src={g.imageUrl} alt="" className="w-full h-32 object-cover rounded-lg" />
                          <div className="font-bold text-xs truncate">{g.title}</div>
                          <button
                            onClick={async () => {
                              setGallery(gallery.filter(item => item.id !== g.id));
                              if (supabaseClient) {
                                try {
                                  await supabaseClient.from('gallery').delete().eq('id', g.id);
                                } catch (err) {
                                  console.warn("Supabase delete gallery fallback:", err);
                                }
                              }
                            }}
                            className="w-full py-1 text-red-600 bg-red-50 hover:bg-red-100 rounded text-[11px] font-bold"
                          >
                            Hapus Foto
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  {newGalleryModal && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
                        <div className="flex justify-between items-center pb-2 border-b">
                          <h3 className="font-bold text-base text-slate-900">Tambah Foto Galeri Baru</h3>
                          <button onClick={() => setNewGalleryModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                        </div>

                        <form onSubmit={handleSaveGallery} className="space-y-4 text-xs">
                          <div>
                            <label className="block font-bold text-slate-700 mb-1">Judul Foto / Kegiatan</label>
                            <input
                              type="text"
                              required
                              value={galleryForm.title}
                              onChange={(e) => setGalleryForm({ ...galleryForm, title: e.target.value })}
                              className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                              placeholder="Masukkan judul kegiatan"
                            />
                          </div>

                          <div>
                            <label className="block font-bold text-slate-700 mb-1">Kategori</label>
                            <select
                              value={galleryForm.category}
                              onChange={(e) => setGalleryForm({ ...galleryForm, category: e.target.value })}
                              className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                            >
                              <option value="Pendidikan">Pendidikan</option>
                              <option value="Santunan">Santunan</option>
                              <option value="Sosial">Sosial</option>
                              <option value="Ramadhan">Ramadhan</option>
                              <option value="Pembangunan">Pembangunan</option>
                            </select>
                          </div>

                          <div>
                            <label className="block font-bold text-slate-700 mb-1">URL Foto Image</label>
                            <input
                              type="url"
                              required
                              value={galleryForm.imageUrl}
                              onChange={(e) => setGalleryForm({ ...galleryForm, imageUrl: e.target.value })}
                              className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                              placeholder="https://..."
                            />
                          </div>

                          <div>
                            <label className="block font-bold text-slate-700 mb-1">Keterangan / Deskripsi Singkat</label>
                            <textarea
                              rows={2}
                              value={galleryForm.description}
                              onChange={(e) => setGalleryForm({ ...galleryForm, description: e.target.value })}
                              className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-[#1F5946] outline-none"
                              placeholder="Deskripsi ringkas kegiatan..."
                            />
                          </div>

                          <div className="flex justify-end space-x-2 pt-2 border-t">
                            <button
                              type="button"
                              onClick={() => setNewGalleryModal(false)}
                              className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold"
                            >
                              Batal
                            </button>
                            <button
                              type="submit"
                              className="px-5 py-2 bg-[#1F5946] hover:bg-[#174435] text-white font-bold rounded-xl shadow"
                            >
                              Simpan Foto
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {adminTab === 'settings' && (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-6 text-xs">
                  <h3 className="font-bold text-slate-900 text-base">Pengaturan Identitas & Media Sosial</h3>
                  
                  <div className="space-y-4">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Nama Lembaga</label>
                      <input
                        type="text"
                        value={settings.orgName}
                        onChange={(e) => setSettings({ ...settings, orgName: e.target.value })}
                        className="w-full p-2.5 border rounded-xl font-bold"
                      />
                    </div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">TikTok Resmi</label>
                        <input
                          type="text"
                          value={settings.tiktok}
                          onChange={(e) => setSettings({ ...settings, tiktok: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Instagram Resmi</label>
                        <input
                          type="text"
                          value={settings.instagram}
                          onChange={(e) => setSettings({ ...settings, instagram: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                    </div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">WhatsApp Layanan</label>
                        <input
                          type="text"
                          value={settings.whatsapp}
                          onChange={(e) => setSettings({ ...settings, whatsapp: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Email Lembaga</label>
                        <input
                          type="email"
                          value={settings.email}
                          onChange={(e) => setSettings({ ...settings, email: e.target.value })}
                          className="w-full p-2.5 border rounded-xl"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Alamat Kantor</label>
                      <input
                        type="text"
                        value={settings.address}
                        onChange={(e) => setSettings({ ...settings, address: e.target.value })}
                        className="w-full p-2.5 border rounded-xl"
                      />
                    </div>

                    <button
                      type="button"
                      onClick={handleSaveSettings}
                      className="w-full py-3 bg-[#1F5946] hover:bg-[#174435] text-white font-bold rounded-xl transition"
                    >
                      Simpan Perubahan
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
